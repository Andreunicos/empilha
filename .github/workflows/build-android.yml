name: Montar app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Configurar anúncio premiado
        run: |
          echo "window.EMPILHA_CONFIG = { version: \"1.1.${{ github.run_number }}\", rewardedId: \"${{ vars.ADMOB_REWARDED_ID || 'ca-app-pub-4670538085926791/6171940457' }}\" };" > www/config.js
          cat www/config.js

      - name: Preparar projeto Android
        run: |
          npm run build
          npx cap sync android

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Falta o segredo KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Compilar (.aab para a Play Store e .apk para testar)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-4670538085926791~2800591524' }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Publicar arquivos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=1.1.${{ github.run_number }}
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab out/bigstack-$V.aab
          cp android/app/build/outputs/apk/release/app-release.apk out/bigstack-$V.apk
          cp out/bigstack-$V.apk out/bigstack.apk
          AD="${{ vars.ADMOB_APP_ID || 'ca-app-pub-4670538085926791~2800591524' }}"
          if [ -z "$AD" ]; then MODE="anúncios de TESTE"; else MODE="anúncios reais"; fi
          gh release create "v$V" out/* --title "Big Stack $V" --notes "Versão $V ($MODE).
          - bigstack-$V.aab: envie para o Google Play Console
          - bigstack-$V.apk: instale direto no celular para testar
          - bigstack.apk: mesma coisa, com nome fixo (link permanente da última versão)"
