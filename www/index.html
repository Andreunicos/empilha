<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1024">
<title>Big Stack</title>
<style>
  @font-face{font-family:"Bungee";src:url(fonts/bungee.woff2) format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Nunito";src:url(fonts/nunito-600.woff2) format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Nunito";src:url(fonts/nunito-800.woff2) format("woff2");font-weight:800;font-display:swap}
  @font-face{font-family:"Nunito";src:url(fonts/nunito-900.woff2) format("woff2");font-weight:900;font-display:swap}
  *{box-sizing:border-box}
  :root{color-scheme:dark;--bg:#0f1024;--card:#1c1b3a;--card2:#2a2852;--line:rgba(255,255,255,.1);--ink:#fff7e8;--muted:#b3b0d4;--sun:#ffc23d;--sunD:#c98a00;--pink:#ff5d8f;--pinkD:#b3285a;--gem:#5ee0ff;--gemD:#1d9bc0;--ok:#4fe39a;--okD:#1f9c62;--vio:#8b7bff;--vioD:#3a2699;
    --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{font-family:"Nunito",system-ui,sans-serif}
  #wrap{position:absolute;top:var(--sat);bottom:var(--sab);left:0;right:0;max-width:520px;margin:0 auto;overflow:hidden}
  canvas#c{display:block;width:100%;height:100%}
  .coin{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2a8,var(--sun) 45%,var(--sunD));box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);vertical-align:-.1em;flex:none}
  .gem{display:inline-block;width:.72em;height:.72em;transform:rotate(45deg);background:linear-gradient(135deg,#d9f8ff,var(--gem) 50%,var(--gemD));border-radius:2px;vertical-align:-.02em;margin-inline:.12em;flex:none}
  .wallet{position:absolute;top:14px;left:14px;display:flex;gap:8px;z-index:6;pointer-events:none}
  .pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);border-radius:999px;padding:6px 12px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;transition:transform .15s}
  .pill.bump{transform:scale(1.15)}
  .icon-btn{position:absolute;top:10px;right:12px;z-index:7;width:42px;height:42px;border-radius:14px;border:0;background:rgba(0,0,0,.4);color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn svg{width:22px;height:22px}
  .hud{position:absolute;top:56px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
  #score{font-family:"Bungee",Impact,sans-serif;font-size:64px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35)}
  #score.pop{animation:spop .25s ease-out}
  @keyframes spop{0%{transform:scale(1.28)}100%{transform:scale(1)}}
  #combo{font-family:"Bungee",Impact,sans-serif;font-size:18px;color:var(--sun);min-height:22px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  #combo.pop{animation:cpop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes cpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  #pw{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-inline:16px}
  .chip{font:900 12px "Nunito",sans-serif;letter-spacing:.06em;padding:4px 9px;border-radius:999px;color:#1a1030;animation:cpop .4s}
  #hint{position:absolute;left:0;right:0;bottom:30%;text-align:center;font-weight:900;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85);pointer-events:none;animation:blink 1.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  #banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-family:"Bungee",Impact,sans-serif;text-shadow:0 4px 0 rgba(0,0,0,.35);animation:ban 2.4s ease forwards}
  #banner small{display:block;font-size:14px;letter-spacing:.2em;color:var(--sun)}
  #banner span{font-size:40px}
  @keyframes ban{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.05)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
  /* barra de habilidades */
  #abar{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:16px;z-index:5;pointer-events:none;animation:pin .4s cubic-bezier(.2,1.3,.4,1)}
  .ab{pointer-events:auto;position:relative;width:60px;height:60px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.35);transition:transform .1s;touch-action:manipulation}
  .ab:active{transform:scale(.88)}
  .ab svg{width:30px;height:30px;pointer-events:none}
  .ab .bd{position:absolute;top:-5px;right:-5px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font:900 13px "Nunito",sans-serif;color:#fff;background:#e53950;border:2px solid #fff;padding:0 5px;pointer-events:none}
  .ab .bd.plus{background:#2fbf5b;font-size:19px;line-height:1}
  .ab .lbl{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font:900 10px "Nunito",sans-serif;letter-spacing:.05em;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;pointer-events:none}
  .ab.on{animation:abpulse .7s ease-in-out infinite alternate}
  .ab.spent{filter:grayscale(.85) brightness(.75)}
  .ab.idle{filter:grayscale(.7) brightness(.7);opacity:.7}
  .ab .bd.spent{background:#5b5670;font-size:12px}
  .ab.nope{animation:abnope .35s}
  @keyframes abnope{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  @keyframes abpulse{to{box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35),0 0 0 6px rgba(255,255,255,.35)}}
  .a-magnet{background:linear-gradient(160deg,#ff7a9c,#e0305a)}.a-slow{background:linear-gradient(160deg,#6fd0ff,#2a86d8)}.a-wide{background:linear-gradient(160deg,#6ff0a8,#1fa864)}.a-calm{background:linear-gradient(160deg,#c7b3ff,#7a5ae0)}
  .pwr{flex-direction:row!important;align-items:center!important;text-align:left;gap:12px!important}
  .pwr .ico{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35)}
  .pwr .ico svg{width:26px;height:26px}
  .pwr .inf{flex:1;display:flex;flex-direction:column;gap:3px}
  .pwr .ds{font-size:12px;color:var(--muted);font-weight:800}
  .pwr .own{font-size:12px;color:var(--sun);font-weight:900}
  .pwr .bts{display:flex;flex-direction:column;gap:8px}
  #grid.list{grid-template-columns:1fr}
  /* panels */
  .panel{-webkit-mask-image:linear-gradient(180deg,transparent 0,transparent 54px,#000 66px);mask-image:linear-gradient(180deg,transparent 0,transparent 54px,#000 66px);position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:64px 18px 24px;text-align:center;background:linear-gradient(180deg,rgba(15,16,36,.15) 0%,rgba(15,16,36,.82) 38%,rgba(15,16,36,.95) 100%);animation:pfade .25s ease-out}
  .inner{margin-block:auto;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;animation:pin .4s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pfade{from{opacity:0}}
  @keyframes pin{from{opacity:0;transform:translateY(18px) scale(.96)}}
  .panel h2{font-family:"Bungee",Impact,sans-serif;font-size:28px;margin:0}
  .panel p{margin:0;color:var(--muted);font-size:15px;max-width:32ch}
  .big-title{font-family:"Bungee",Impact,sans-serif;font-size:clamp(44px,14vw,68px);margin:0;line-height:.95;color:var(--sun);text-shadow:0 5px 0 var(--pink)}
  /* logo tiles */
  .logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0}
  .logo .ln{display:flex;gap:6px}
  .logo i{font-style:normal;font-family:"Bungee",Impact,sans-serif;font-size:clamp(30px,10.5vw,50px);width:1.22em;height:1.22em;display:grid;place-items:center;border-radius:.22em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);box-shadow:inset 0 .12em 0 rgba(255,255,255,.35),inset 0 -.14em 0 rgba(0,0,0,.25),0 .12em 0 rgba(0,0,0,.35);animation:tdrop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*70ms)}
  .logo.idle i{animation:tbob 3s ease-in-out infinite;animation-delay:calc(var(--i)*120ms)}
  @keyframes tdrop{0%{transform:translateY(-120px) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:none}}
  @keyframes tbob{50%{transform:translateY(-4px)}}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{position:relative;font-family:"Bungee",Impact,sans-serif;font-size:20px;color:#1a1030;background:var(--sun);border:0;border-radius:14px;padding:13px 26px;box-shadow:0 5px 0 var(--sunD);cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sunD)}
  .btn:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible,.sw:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .btn.play{font-size:26px;padding:16px 48px;animation:breathe 2.2s ease-in-out infinite}
  #over .btn.play{white-space:nowrap;padding:14px 34px}
  @media (max-height:720px){#over .big-title{font-size:40px}#over .stats b{font-size:26px}#over .earn{padding:10px 14px;gap:3px;font-size:14px}#over .btn.play{font-size:22px;padding:12px 28px}#over .up{padding:8px 12px;font-size:13px}#over .inner{gap:9px}
    #menu .inner{gap:10px}#menu .logo i{font-size:clamp(26px,9vw,42px)}}
  @keyframes breathe{50%{transform:scale(1.05)}}
  .btn.alt{background:var(--card2);color:var(--ink);box-shadow:0 5px 0 #0b0a1f}
  .btn.gemb{background:var(--gem);box-shadow:0 5px 0 var(--gemD)}
  .btn.pinkb{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pinkD)}
  .btn.okb{background:var(--ok);box-shadow:0 5px 0 var(--okD)}
  .btn.sm{font-size:15px;padding:10px 16px;border-radius:12px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn svg{width:18px;height:18px}
  .dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:2px solid var(--bg);animation:blink 1.4s infinite}
  .link{background:none;border:0;color:var(--muted);font:800 15px "Nunito",sans-serif;text-decoration:underline;cursor:pointer;padding:8px}
  .lvl{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;width:min(100%,320px)}
  .badge{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,var(--vio),#5a3fd6);font-family:"Bungee",Impact,sans-serif;font-size:20px;box-shadow:0 3px 0 var(--vioD)}
  .lvl .info{flex:1;display:flex;flex-direction:column;gap:5px;text-align:left}
  .lvl .t{display:flex;justify-content:space-between;font-weight:900;font-size:14px}
  .lvl .t span{color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--vio),#c19bff);transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .bar.g i{background:linear-gradient(90deg,var(--ok),#a8ffcf)}
  .ring{position:relative;width:110px;height:110px}
  .ring svg{transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bungee",Impact,sans-serif;font-size:40px}
  .earn{background:var(--card);border-radius:16px;padding:14px 18px;width:min(100%,320px);display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
  .earn div{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--muted);animation:pin .35s both}
  .earn div b{color:var(--ink);display:flex;align-items:center;gap:4px}
  .earn .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-size:18px;color:var(--ink)}
  .earn .x2,.earn .x2 b{color:var(--pink)}
  .stats{display:flex;gap:28px;font-variant-numeric:tabular-nums}
  .stats div{display:flex;flex-direction:column}
  .stats b{font-family:"Bungee",Impact,sans-serif;font-size:32px}
  .stats span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .hot{font-family:"Bungee",Impact,sans-serif;color:var(--pink);font-size:17px;animation:pop .6s ease-in-out infinite alternate}
  .up{background:linear-gradient(160deg,var(--vio),#5a3fd6);border-radius:14px;padding:10px 16px;font-weight:900;width:min(100%,320px);animation:pin .5s .3s both}
  @keyframes pop{to{transform:scale(1.08)}}
  .top{display:flex;width:100%;justify-content:space-between;align-items:center}
  .tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
  .tab{background:none;border:0;color:var(--muted);font:900 15px "Nunito",sans-serif;padding:9px 18px;border-radius:10px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--card2);color:var(--ink)}
  .full{background:rgba(15,16,36,.97);justify-content:flex-start}
  .full .inner{margin-block:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%}
  .item{background:var(--card);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch;border:2px solid transparent;animation:pin .35s both}
  .item.on{border-color:var(--ok)}
  .item canvas{width:100%;height:84px;border-radius:10px;background:#15142f}
  .item .nm{font-weight:900;font-size:15px}
  .item .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:-6px}
  .item .btn{font-size:14px;padding:9px 8px;border-radius:10px}
  .item .btn.used{background:var(--ok);box-shadow:0 4px 0 var(--okD)}
  .pack .big{font-family:"Bungee",Impact,sans-serif;font-size:28px;padding-block:16px;display:flex;justify-content:center;align-items:center;gap:4px}
  .pack .best{font-size:11px;font-weight:900;letter-spacing:.1em;color:#fff;background:var(--pink);border-radius:6px;padding:2px 6px;align-self:center}
  .note{font-size:12px!important;color:var(--muted);max-width:40ch;margin-inline:auto!important}
  .btn.dlyb{background:linear-gradient(160deg,#39d0e6,#2a7fd6);color:#fff;box-shadow:0 5px 0 #1d5a9e;width:min(100%,320px);gap:8px}
  .btn.dlyb svg{width:22px;height:22px;flex:none}.btn.dlyb small{font:900 12px "Nunito",sans-serif;background:rgba(0,0,0,.25);border-radius:99px;padding:2px 8px;letter-spacing:.02em}
  .btn.dlyb.done{filter:saturate(.5) brightness(.85)}
  .btn.share{background:linear-gradient(160deg,#4fe39a,#27b877);color:#08301d;box-shadow:0 5px 0 #1a8a55}.btn.share svg{width:18px;height:18px}
  #dlyTag{font:900 12px "Nunito",sans-serif;letter-spacing:.14em;color:#7fe7ff;background:rgba(0,0,0,.35);border-radius:99px;padding:3px 12px;margin:0 auto 4px;width:max-content}
  .tier{vertical-align:-3px;flex:none}
  .rrow .tier{margin-right:6px}
  .ppcard{width:100%;background:linear-gradient(160deg,#2a2356,#1b1640);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08)}
  .ppcard .fl{font-size:44px;line-height:1}.ppcard .nm{font-family:"Bungee",Impact,sans-serif;font-size:21px;word-break:break-all}
  .ppcard .tr{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px;margin-top:4px}.ppcard .lv{font-size:13px;color:var(--muted);font-weight:800;margin-top:2px}
  .ppgrid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ppgrid div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;text-align:left}.ppgrid b{display:block;font-family:"Bungee",Impact,sans-serif;font-size:22px}.ppgrid span{font-size:12px;font-weight:800;color:var(--muted)}
  .ppmed{width:100%;display:flex;flex-wrap:wrap;gap:8px}.ppmed .md{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border-radius:99px;padding:6px 12px 6px 6px;font-weight:900;font-size:13px}
  .ppmed .md i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:"Bungee",Impact,sans-serif;font-size:13px;color:#1a1030}
  .ppmed .none{color:var(--muted);font-size:13px;font-weight:700;text-align:left}
  .ppach{width:100%;display:grid;grid-template-columns:1fr;gap:8px}
  .ach{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 12px;text-align:left}
  .ach img{width:46px;height:46px;border-radius:12px;flex:none}.ach.lock img{filter:grayscale(1) brightness(.55)}.ach.lock{opacity:.8}
  .ach b{display:block;font-size:14px}.ach span{font-size:12px;color:var(--muted);font-weight:700}.ach .bar{margin-top:5px;height:6px}
  .ovtic{font-size:56px;animation:pop .7s ease-in-out infinite alternate}
  .ovtlist{display:flex;flex-direction:column;gap:6px;width:min(100%,320px)}.ovtlist div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px;font-weight:900;display:flex;gap:8px;align-items:center}
  .ovtlist b{margin-left:auto;font-family:"Bungee",Impact,sans-serif}
  .sec{width:100%;text-align:left;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%}
  .day{background:var(--card);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:900;color:var(--muted);border:2px solid transparent}
  .day b{font-size:13px;color:var(--ink);display:flex;align-items:center}
  .day.done{opacity:.45}
  .day.now{border-color:var(--sun);color:var(--sun);animation:pop .7s ease-in-out infinite alternate}
  .mis{background:var(--card);border-radius:14px;padding:12px 14px;width:100%;display:flex;gap:12px;align-items:center;text-align:left;animation:pin .35s both}
  .mis .info{flex:1;display:flex;flex-direction:column;gap:6px}
  .mis .nm{font-weight:900;font-size:15px}
  .mis .pr{font-size:12px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
  .mis .btn{font-size:13px;padding:9px 10px;border-radius:10px;min-width:84px}
  /* dicas e como jogar */
  #tipB{position:absolute;left:50%;transform:translateX(-50%);z-index:9;width:min(88%,330px);background:#fff7e8;color:#1a1030;border-radius:16px;padding:12px 14px;font:900 15px/1.3 "Nunito",sans-serif;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45);pointer-events:none;animation:tipin .45s cubic-bezier(.2,1.5,.4,1)}
  #tipB::after{content:"";position:absolute;left:50%;margin-left:-9px;border:9px solid transparent}
  #tipB.tp-bar{bottom:104px}#tipB.tp-bar::after{top:100%;border-top-color:#fff7e8}
  #tipB.tp-mid{top:24%}#tipB.tp-mid::after{top:100%;border-top-color:#fff7e8}
  #tipB b{color:#b3285a}
  @keyframes tipin{from{opacity:0;transform:translate(-50%,14px) scale(.9)}}
  .help-link{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:16px}
  .help-link .q{width:24px;height:24px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-family:"Bungee",Impact,sans-serif;font-size:14px}
  .hcards{width:100%;display:flex;flex-direction:column;gap:10px}
  .hcard{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left;animation:pin .35s both}
  .hcard canvas{width:96px;height:84px;flex:none;border-radius:12px;background:#15142f}
  .hcard b{display:block;font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:16px;margin-bottom:3px}
  .hcard span{font-size:14px;color:var(--muted);font-weight:800;line-height:1.35}
  .cloud{width:100%;background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .cl-st{font-weight:900;display:flex;align-items:center;gap:8px}
  .dotok,.dotoff{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(79,227,154,.25)}.dotoff{background:#77738f;box-shadow:none}
  /* ranking */
  .btn.rankb{background:linear-gradient(160deg,#ffd76a,#f0a91c);box-shadow:0 5px 0 #b9780a;display:flex;align-items:center;gap:8px;padding-inline:22px}
  .btn.rankb svg{width:20px;height:20px}
  .orank{border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;width:min(100%,320px);display:flex;justify-content:center;gap:16px;font:800 15px "Nunito",sans-serif;cursor:pointer;animation:pin .4s both}
  .orank b{font-family:"Bungee",Impact,sans-serif;color:var(--sun);font-weight:400}
  .rme-btn{border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;width:100%;display:flex;align-items:center;gap:10px;font:900 17px "Nunito",sans-serif;cursor:pointer;text-align:left}
  .rme-btn .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rme-btn svg{width:20px;height:20px;color:var(--muted)}
  .fl{font-size:22px;line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
  .rtab{background:none;border:0;color:var(--muted);font:900 15px "Nunito",sans-serif;padding:9px 22px;border-radius:10px;cursor:pointer}
  .rtab[aria-selected="true"]{background:var(--card2);color:var(--ink)}
  .rprize{width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;background:linear-gradient(160deg,rgba(255,194,61,.18),rgba(255,93,143,.14));border:1.5px solid rgba(255,194,61,.45);border-radius:14px;padding:10px 12px;font-weight:900}
  .rprize .tro{width:24px;height:24px}
  .rprize b{color:var(--gem);display:inline-flex;align-items:center}
  .rprize small{width:100%;font-size:12px;color:var(--muted);font-weight:800}
  .rlist{width:100%;display:flex;flex-direction:column;gap:6px}
  .rlist.mine{border-top:1px dashed var(--line);padding-top:8px}
  .rrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:900;animation:pin .3s both}
  .rrow .pos{width:34px;text-align:center;font-family:"Bungee",Impact,sans-serif;font-weight:400;color:var(--muted);font-size:14px}
  .rrow .pos i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#1a1030;font-size:15px}
  .rrow.p1 .pos i{background:linear-gradient(160deg,#fff1a6,#f5c542 55%,#c98a00)}
  .rrow.p2 .pos i{background:linear-gradient(160deg,#ffffff,#c9cfe0 55%,#8d94ab)}
  .rrow.p3 .pos i{background:linear-gradient(160deg,#ffd2a6,#e0914a 55%,#9c5620)}
  .rrow.p1{background:linear-gradient(90deg,rgba(255,194,61,.22),var(--card))}
  .rrow .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
  .rrow .sc{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
  .rrow.me{background:linear-gradient(90deg,rgba(79,227,154,.28),var(--card2));outline:2px solid var(--ok)}
  .rempty{color:var(--muted);font-weight:800;padding:26px 10px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .rempty.sm{padding:10px}
  .spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--sun);animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .tin{width:min(100%,320px);font:900 20px "Nunito",sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:center;-webkit-user-select:text;user-select:text;outline:none}
  .tin:focus{border-color:var(--sun)}
  .tin.sm{font-size:15px;padding:9px 12px}
  .pfname{-webkit-user-select:none;user-select:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pfnote{font-size:13px;opacity:.75;margin:-4px 0 2px}
  .btn.pgb{font-size:15px;padding:10px 18px}
  .ccbtn{width:min(100%,320px);display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font:900 16px "Nunito",sans-serif;cursor:pointer;text-align:left}
  .ccbtn span:nth-child(2){flex:1}
  .ccbtn svg{width:20px;height:20px}
  .cclist{width:min(100%,320px);max-height:38vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;background:var(--card);border-radius:14px;padding:6px}
  .cclist button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);font:800 15px "Nunito",sans-serif;padding:8px 10px;border-radius:10px;text-align:left;cursor:pointer}
  .cclist button.on{background:var(--card2)}
  .bigtro{width:96px;height:96px;color:var(--sun);animation:pop .7s ease-in-out infinite alternate;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
  .bigtro svg{width:100%;height:100%}
  .panel h2.gold{color:var(--sun)}
  .wingem{font-family:"Bungee",Impact,sans-serif;font-size:40px;display:flex;align-items:center;gap:6px}
  /* settings */
  .set{background:var(--card);border-radius:16px;width:100%;display:flex;flex-direction:column;text-align:left}
  .srow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
  .srow:first-child{border-top:0}
  .srow .lb{flex:1;font-weight:900;font-size:16px}
  .srow input[type=range]{width:100%;accent-color:var(--sun)}
  .srow.sub{padding-top:0;border-top:0}
  .sw{width:52px;height:30px;border-radius:99px;border:0;background:#3a3860;position:relative;cursor:pointer;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
  .sw[aria-checked="true"]{background:var(--ok)}
  .sw[aria-checked="true"]::after{transform:translateX(22px)}
  .seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;flex-wrap:wrap}
  .seg button{flex:1;border:0;background:none;color:var(--muted);font:900 14px "Nunito",sans-serif;padding:8px 10px;border-radius:9px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--card2);color:var(--ink)}
  .ver{font-size:12px;color:var(--muted)}
  /* intro */
  #intro{position:fixed;inset:0;z-index:20;background:#0b0b1a;display:grid;place-items:center;transition:opacity .5s}
  #intro.out{opacity:0;pointer-events:none}
  #intro .studio{display:flex;flex-direction:column;align-items:center;gap:10px;animation:iin 1.1s cubic-bezier(.2,1,.3,1) both}
  #intro img{max-width:min(62vw,280px);max-height:40vh}
  #intro .word{font-family:"Bungee",Impact,sans-serif;font-size:clamp(34px,11vw,54px);letter-spacing:.06em;background:linear-gradient(180deg,#fff,#c9c3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #intro small{font-weight:900;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);font-size:12px}
  @keyframes iin{from{opacity:0;transform:scale(.85);filter:blur(6px)}}
  #ad{z-index:9;background:#000}
  #ad .box{width:100%;max-width:340px;aspect-ratio:9/12;max-height:60vh;border-radius:18px;background:linear-gradient(160deg,#2b2f77,#7b2b8a);display:grid;place-items:center;font-family:"Bungee",Impact,sans-serif;font-size:22px;padding:20px}
  .tag2{font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  #toast{pointer-events:none;position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:10;background:var(--card2);padding:10px 16px;border-radius:12px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.4);width:max-content;max-width:88%;text-align:center;animation:tin .3s cubic-bezier(.2,1.4,.4,1)}
  #abar:not([hidden])~#toast{bottom:112px}
  @keyframes tin{from{opacity:0;transform:translate(-50%,16px)}}
  .fly{position:absolute;z-index:11;width:18px;height:18px;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <button class="icon-btn" id="gear" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button class="icon-btn" id="pauseBtn" aria-label="Pausa" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  <div class="hud" id="hud" hidden><div id="dlyTag" hidden data-t="dlyTag"></div><div id="score">0</div><div id="combo"></div><div id="pw"></div></div>

    <button class="ab a-magnet" data-a="magnet" aria-label="Ímã"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M6 4v8a6 6 0 0 0 12 0V4"/><path d="M6 4v3M18 4v3" stroke="#ffe8a0" stroke-width="3.4"/></svg><span class="bd"></span><span class="lbl" data-t="a_magnet"></span></button>

const A={ctx:null,master:null,music:null,sfx:null,rev:null,noise:null,musicOn:false};
function audioInit(){
  if(A.ctx)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;const ac=new C();A.ctx=ac;
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
    A.master=ac.createGain();A.master.gain.value=.9;A.master.connect(comp);
    A.music=ac.createGain();A.sfx=ac.createGain();A.music.connect(A.master);A.sfx.connect(A.master);
    // reverb com impulso gerado
    const len=ac.sampleRate*2.2,ir=ac.createBuffer(2,len,ac.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
    A.rev=ac.createConvolver();A.rev.buffer=ir;const rg=ac.createGain();rg.gain.value=.32;A.rev.connect(rg);rg.connect(A.master);
    const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;A.noise=nb;
    applyVolumes();
  }catch(e){A.ctx=null}
}
function applyVolumes(){if(!A.ctx)return;const s=S.settings,n=A.ctx.currentTime;A.music.gain.setTargetAtTime(s.music?s.musicVol/100*.55:0,n,.1);A.sfx.gain.setTargetAtTime(s.sfx?s.sfxVol/100:0,n,.05);if(s.music)musicStart();}
const now=()=>A.ctx.currentTime;
function env(g,t0,a,peak,d){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d)}
function osc(type,f,t0,dur,peak,dest,{a=.005,glide=0,rev=0}={}){const ac=A.ctx,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(glide)o.frequency.exponentialRampToValueAtTime(glide,t0+dur);env(g,t0,a,peak,dur);o.connect(g);g.connect(dest);if(rev){const s=ac.createGain();s.gain.value=rev;g.connect(s);s.connect(A.rev)}o.start(t0);o.stop(t0+a+dur+.05);return o}
function noise(t0,dur,peak,dest,type='bandpass',f=1800,q=1,f2){const ac=A.ctx,s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=A.noise;fl.type=type;fl.frequency.setValueAtTime(f,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+dur);fl.Q.value=q;env(g,t0,.003,peak,dur);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t0);s.stop(t0+dur+.05)}
function bell(f,t0,peak=.22,dur=1.1,rev=.5){osc('sine',f,t0,dur,peak,A.sfx,{a:.004,rev});osc('sine',f*2,t0,dur*.6,peak*.35,A.sfx,{a:.004,rev});osc('triangle',f*3.01,t0,dur*.25,peak*.12,A.sfx,{a:.002})}

const sfx={
  ok:()=>S.settings.sfx&&A.ctx&&A.ctx.state==='running',
  place(h){if(!sfx.ok())return;const t0=now(),b=120+Math.min(h,60)*1.2;osc('sine',b*1.6,t0,.16,.5,A.sfx,{glide:b*.6});noise(t0,.05,.18,A.sfx,'bandpass',2400,1.2);osc('triangle',b*3,t0,.05,.06,A.sfx)},

  perfect(c){if(!sfx.ok())return;const t0=now(),i=Math.min(c-1,PENTA.length-1);bell(PENTA[i],t0,.2);if(c>=3)bell(PENTA[Math.min(i+2,PENTA.length-1)]*1,t0+.07,.1,.8);osc('sine',150,t0,.12,.35,A.sfx,{glide:70})},

  ui(){if(!sfx.ok())return;const t0=now();osc('sine',780,t0,.07,.18,A.sfx,{glide:420});noise(t0,.02,.06,A.sfx,'highpass',5000)},

  fanfare(){if(!sfx.ok())return;const t0=now();[523.25,659.25,783.99,1046.5,1318.51].forEach((f,j)=>bell(f,t0+j*.09,.14,1.2,.6))},

const M={timer:null,next:0,step:0,bpm:92};
const CH=[[130.81,164.81,196,246.94],[110,130.81,164.81,196],[87.31,110,130.81,164.81],[98,123.47,146.83,164.81]];
function musicStart(){if(!A.ctx||M.timer||!S.settings.music)return;M.next=A.ctx.currentTime+.1;M.step=0;M.timer=setInterval(musicTick,60)}
function musicStop(){clearInterval(M.timer);M.timer=null}
function musicTick(){const ac=A.ctx;if(!ac||ac.state!=='running')return;const e=60/M.bpm/2;
  while(M.next<ac.currentTime+.25){playStep(M.step,M.next,e);M.next+=e;M.step++}}
function playStep(s,t0,e){
  const bar=Math.floor(s/8)%4,b8=s%8,ch=CH[bar],dest=A.music,ac=A.ctx;
  if(b8===0){ // pad
    ch.forEach(f=>{[0,-6].forEach(det=>{const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type='triangle';o.frequency.value=f;o.detune.value=det;fl.type='lowpass';fl.frequency.value=900;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.05,t0+.6);g.gain.setValueAtTime(.05,t0+e*7);g.gain.exponentialRampToValueAtTime(.0001,t0+e*8+.4);o.connect(fl);fl.connect(g);g.connect(dest);const sg=ac.createGain();sg.gain.value=.4;g.connect(sg);sg.connect(A.rev);o.start(t0);o.stop(t0+e*8+.5)})});
  }
  if(b8===0||b8===4){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=ch[0]/2;env(g,t0,.01,.22,e*3.5);o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+e*4)}
  if(b8===2||b8===6){const s2=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s2.buffer=A.noise;f.type='highpass';f.frequency.value=6500;env(g,t0,.002,.035,.06);s2.connect(f);f.connect(g);g.connect(dest);s2.start(t0);s2.stop(t0+.1)}
  if(Math.random()<.62){const f=ch[(Math.random()*4)|0]*(Math.random()<.5?4:2);const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;env(g,t0,.005,.07,e*2.2);o.connect(g);g.connect(dest);const sg=ac.createGain();sg.gain.value=.6;g.connect(sg);sg.connect(A.rev);o.start(t0);o.stop(t0+e*2.5)}
}

/* ================= GAME ================= */
const BASEW=0.62;
let stack=[],moving=null,debris=[],parts=[],floats=[],rings=[],cam=0,camT=0,score=0,combo=0,perfects=0,maxCombo=0,state='menu',speed=4.2,shake=0,flash=0,lastT=0,landT=-1e9;
// começo mais fácil: até o andar 20 o bloco é mais lento e o perfeito é mais generoso
const ease=()=>Math.min(1,score/20);
const perfTol=()=>Math.max(6,speed*1.1)*(W/360)*(1.8-.8*ease());
const SPEED0=4.2,SPEED_STEP=.06,SPEED_MAX=9,SPEED_MAX_SPACE=10;
const WAVE_W=Math.PI*2/2400; // ondas gravitacionais: 1 ciclo a cada 2,4 s
const waveAmp=wd=>Math.min(.45,.28+(wd-3)*.04);
const hazard=()=>worldOf(score)>=1; // cidade não tem perigo; nuvens, aurora e espaço têm
const RANDOM_POWERS=['slow','magnet','wide','x2'];
// bônus grátis: durante vento/velocidade/ondas o LENTO fica bem mais raro (10% em vez de 25%)
function pickBonus(){const unstable=hazard()&&!(P&&P.calm>0);const w={slow:unstable?1:3,magnet:3,wide:3,x2:3};
  let tot=0;for(const k of RANDOM_POWERS)tot+=w[k];let r=rnd()*tot;for(const k of RANDOM_POWERS){r-=w[k];if(r<0)return k}return 'x2'}
let mode='normal',rnd=Math.random;
let run,P,nextPower,windDir=1,videoUsed=false,gemRevives=0,revTimer=null;
const POWERS={slow:{col:'#7fd1ff',n:6},magnet:{col:'#ff5d8f',n:3},wide:{col:'#4fe39a',n:0},x2:{col:'#ffc23d',n:10},calm:{col:'#b9a3ff',n:15}};
const ABIL={magnet:{price:900,n:3},slow:{price:600,n:8},wide:{price:750,n:0},calm:{price:500,n:15}};
function reset(){
  rnd=mode==='daily'?mulberry(seedOf(dayKey())):Math.random;hue0=rnd()*360;const w=W*BASEW;
  stack=[{x:(W-w)/2,w,i:0,t0:-1e9}];debris=[];parts=[];floats=[];rings=[];cam=0;camT=0;score=0;combo=0;perfects=0;maxCombo=0;speed=SPEED0*.62;shake=0;flash=0;skyF=0;
  run={blocks:0,perf:0,chest:0,gems:0,powers:0,chests:0,vid:{},taps:[],errs:[],play:0};P={slow:0,magnet:0,x2:0,calm:0};nextPower=6+(rnd()*4|0);
  videoUsed=false;gemRevives=0;renderPw();spawn();
}
function spawn(){
  const top=stack[stack.length-1];const dir=stack.length%2?1:-1;
  moving={w:top.w,x:dir>0?-top.w:W,dir,i:stack.length,v:.75+rnd()*.6,pw:null};
  if(state==='play'&&score>=nextPower){moving.pw=pickBonus();nextPower=score+8+(rnd()*6|0);tip('bonus',t('tipBonus'),'mid')}
  windDir=rnd()<.5?-1:1;
}
function yOf(i){return H-190-i*BH+cam}
function addFloat(x,y,txt,col,size=18){const near=floats.filter(f=>f.l>.75&&Math.abs(f.y-y)<22).length;floats.push({x,y:y-near*24,txt,col,l:1,size})}
let pwHTML='';function renderPw(){const h=Object.entries(P).filter(([,v])=>v>0).map(([k,v])=>`<span class="chip" style="background:${POWERS[k].col}">${t('p_'+k)} ${v}</span>`).join('');if(h!==pwHTML){pwHTML=h;$('pw').innerHTML=h}}
function popAnim(el){el.classList.remove('pop');requestAnimationFrame(()=>el.classList.add('pop'))}
function setScore(){const el=$('score');el.textContent=score;popAnim(el)}
function setCombo(txt){const el=$('combo');if(el.textContent!==txt)el.textContent=txt;if(txt)popAnim(el)}

function drop(){
  if(state!=='play'||!moving)return;
  // bloco ainda nem chegou na torre (ex.: toque duplo no JOGAR/REVIVER): ignora em vez de perder a partida
  if(!moving.entered){const tp=stack[stack.length-1];if(Math.min(moving.x+moving.w,tp.x+tp.w)-Math.max(moving.x,tp.x)<=0)return}
  $('hint').hidden=true;
  const top=stack[stack.length-1],m=moving;
  if(run.errs&&run.errs.length<3000)run.errs.push({e:Math.abs(m.x-top.x),tol:perfTol(),mag:P.magnet>0});
  // ímã: puxa o bloco para cima da torre (vale até se fosse errar)
  if(P.magnet>0&&Math.abs(m.x-top.x)>=perfTol()){P.magnet--;m.x=top.x;addFloat(top.x+top.w/2,yOf(m.i)-24,t('magnetUse'),'#ff5d8f',14)}
  const left=Math.max(m.x,top.x),right=Math.min(m.x+m.w,top.x+top.w),ov=right-left;
  if(ov<=0){debris.push({x:m.x,w:m.w,y:yOf(m.i),vy:0,vx:m.dir*1.5,r:0,vr:m.dir*.05,i:m.i});moving=null;sfx.fall();buzz([60,40,120]);shake=14;lose();return}
  let nx=left,nw=ov,gain=1;
  const perfect=Math.abs(m.x-top.x)<perfTol();
  if(perfect){
    nx=top.x;nw=top.w;combo++;perfects++;maxCombo=Math.max(maxCombo,combo);gain=3+Math.min(5,Math.max(0,combo-2));
    if(combo>=3){const g=Math.min(12,nw*.08);const nw2=Math.min(W*BASEW,nw+g);if(nw2>nw+.5)m.grew=true;nx=clamp(top.x-(nw2-nw)/2,0,W-nw2);nw=nw2}
    sfx.perfect(combo);buzz(15);flash=1;burst(nx+nw/2,yOf(m.i)+BH/2,hue0+m.i*9,18);rings.push({x:nx,y:yOf(m.i),w:nw,t0:tNow,i:m.i});
    setCombo(combo>1?t('combo',combo):t('perfect'));
  }else{
    combo=0;setCombo('');
    const cx=m.x<top.x?m.x:right,cw=m.w-ov;
    debris.push({x:cx,w:cw,y:yOf(m.i),vy:0,vx:(m.x<top.x?-1:1)*1.2,r:0,vr:(m.x<top.x?-1:1)*.04,i:m.i});
    sfx.place(score);sfx.chop();buzz(8);
  }
  if(P.x2>0){gain*=2;P.x2--}
  if(P.slow>0)P.slow--;
  if(P.calm>0)P.calm--;
  if(perfect)run.perf+=gain;else run.blocks+=gain;
  if(m.pw){
    const pw=POWERS[m.pw];run.powers++;
    if(m.pw==='wide'){const c=nx+nw/2;nw=W*BASEW;nx=clamp(c-nw/2,0,W-nw)}else P[m.pw]=pw.n;
    addFloat(nx+nw/2,yOf(m.i)-30,t('bonusGot',t('p_'+m.pw)),pw.col,21);burst(nx+nw/2,yOf(m.i)+BH/2,0,24,pw.col);sfx.power();
  }
  addFloat(nx+nw/2,yOf(m.i)-6,'+'+gain,gain>1?'#ffc23d':'#fff7e8');
  stack.push({x:nx,w:nw,i:m.i,t0:tNow});landT=tNow;
  if(m.grew){addFloat(nx+nw/2,yOf(m.i)-54,t('grew'),'#4fe39a',17);rings.push({x:nx,y:yOf(m.i),w:nw,t0:tNow+90,i:m.i});tip('grow',t('tipGrow'),'mid')}
  score++;setScore();rivalStep();
  const wd=worldOf(score);
  speed=Math.min(wd>=3?SPEED_MAX_SPACE:SPEED_MAX,SPEED0+score*SPEED_STEP)*(.62+.38*ease());
  if(score%25===0){const cg=20+Math.floor(score/25)*10;run.chest+=cg;run.chests++;let s=t('chest',cg);addFloat(W/2,yOf(m.i)-50,s,'#ffc23d',20);burst(W/2,yOf(m.i),0,40,'#ffc23d');sfx.fanfare()}
  if([25,50,100].includes(score)&&mode!=='daily')setTimeout(()=>{if(state==='play')tip('stab'+wd,t('tipStab'+Math.min(wd,3)),'bar')},2600);
  if(WORLDS.some(w=>w.at===score&&score>0)){setTimeout(()=>{banner(t('world',wd+1),t('w'+wd));sfx.whoosh()},250);toast(t('ev'+wd))}
  if(yOf(stack.length)<H*.42)camT+=BH;
  renderPw();renderAbar();spawn();
}
function burst(x,y,h,n,col){for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,s=2+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,col:col||hsl(h,90,75)})}}

/* ================= DAILY + MISSIONS ================= */
const dstr=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const today=()=>dstr(new Date());const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
const DAILY=[{c:50},{c:75},{c:100},{c:150},{c:200},{c:250},{c:500}]; // cristais só comprando (ou Nº1 do mês)
const MPOOL=[{t:'perf',v:[5,8,12]},{t:'floors',v:[20,30,45]},{t:'games',v:[3,5,8]},{t:'coins',v:[100,200,350]},{t:'power',v:[2,4,6]},{t:'combo',v:[3,5,7]},{t:'chest',v:[1,2,3]}];
function ensureMissions(){
  S.missions.forEach(m=>{if(m.rw&&m.rw.g)m.rw={c:60+m.rw.g*20}});
  if(S.mday===today()&&S.missions.length)return;
  if(S.missions.length&&!clockOk())return;
  let seed=[...today()].reduce((a,ch)=>a*31+ch.charCodeAt(0),7)%100000;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const pool=MPOOL.slice();S.missions=[];
  for(let k=0;k<3;k++){const p=pool.splice(rnd()*pool.length|0,1)[0];const vi=rnd()*3|0;const rw={c:60+vi*45};S.missions.push({t:p.t,n:p.v[vi],prog:0,claimed:false,rw})}
  S.mday=today();save();
}
const mtxt=m=>t('m_'+m.t,m.n);
const rwHTML=r=>r.g?`<i class="gem"></i>${r.g}`:`<i class="coin"></i>&nbsp;${r.c}`;
// relógio: se a data do celular voltar (ou estiver muito diferente da hora do Google), o prêmio diário trava
let srvSkew=0;
const clockOk=()=>Date.now()>=(S.clk||0)-2*3600e3&&Math.abs(srvSkew)<3*3600e3;
const dailyReady=()=>S.daily.last!==today()&&clockOk();
const nextStreak=()=>S.daily.last===yesterday()?S.daily.streak%7+1:1;
function anyClaim(){ensureMissions();return dailyReady()||S.missions.some(m=>m.prog>=m.n&&!m.claimed)}
function renderMis(){
  ensureMissions();const ready=dailyReady();const cur=ready?nextStreak():S.daily.streak;
  $('days').innerHTML=DAILY.map((r,k)=>`<div class="day ${k+1<cur||(!ready&&k+1===cur)?'done':''} ${ready&&k+1===cur?'now':''}">${t('day',k+1)}<b>${rwHTML(r)}</b></div>`).join('');
  $('claimDay').disabled=!ready;$('claimDay').textContent=ready?t('claim'):clockOk()?t('tomorrow'):t('fixClock');
  const Lst=$('misList');Lst.innerHTML='';
  S.missions.forEach((m,k)=>{const done=m.prog>=m.n;const d=document.createElement('div');d.className='mis';d.style.animationDelay=(k*60)+'ms';
    d.innerHTML=`<div class="info"><div class="nm">${mtxt(m)}</div><div class="bar g"><i style="width:${Math.min(100,m.prog/m.n*100)}%"></i></div><div class="pr">${Math.min(m.prog,m.n)}/${m.n}</div></div>`;
    const b=document.createElement('button');b.className='btn sm '+(m.claimed?'alt':done?'okb':'alt');b.innerHTML=m.claimed?t('done'):rwHTML(m.rw);b.disabled=m.claimed||!done;
    b.onclick=()=>{if(m.claimed||m.prog<m.n)return;m.claimed=true;if(m.rw.g)S.gems+=m.rw.g;else S.coins+=m.rw.c;save();wallet();sfx.coin();bump(m.rw.g?'pGems':'pCoins');toast(t('rewardOk'));renderMis();menuDot()};
    d.appendChild(b);Lst.appendChild(d)});
}
$('claimDay').onclick=()=>{if(!dailyReady())return;const st=nextStreak();const r=DAILY[st-1];S.daily={last:today(),streak:st};if(r.g)S.gems+=r.g;else S.coins+=r.c;save();wallet();bump(r.g?'pGems':'pCoins');sfx.fanfare();toast(t('dayOk',st));renderMis();menuDot()};
function menuDot(){$('misDot').hidden=!anyClaim()}
function trackMissions(final){
  ensureMissions();const done=[];
  S.missions.forEach(m=>{if(m.claimed)return;const was=m.prog>=m.n;
    if(m.t==='perf')m.prog=Math.max(m.prog,perfects);
    if(m.t==='floors')m.prog=Math.max(m.prog,score);
    if(m.t==='games')m.prog++;
    if(m.t==='coins')m.prog+=final;
    if(m.t==='power')m.prog+=run.powers;
    if(m.t==='combo')m.prog=Math.max(m.prog,maxCombo);
    if(m.t==='chest')m.prog+=run.chests;
    if(!was&&m.prog>=m.n)done.push(mtxt(m))});
  return done;
}

/* ================= FINISH ================= */
function flyCoins(n,from){
  const wr=$('wrap').getBoundingClientRect(),to=$('pCoins').getBoundingClientRect(),fr=from.getBoundingClientRect();
  const k=Math.min(10,Math.max(3,Math.ceil(n/15)));
  for(let j=0;j<k;j++){const c=document.createElement('i');c.className='coin fly';$('wrap').appendChild(c);
    const x0=fr.left-wr.left+fr.width/2+(Math.random()-.5)*60,y0=fr.top-wr.top+fr.height/2,x1=to.left-wr.left+12,y1=to.top-wr.top+8;
    c.style.left='0px';c.style.top='0px';
    const an=c.animate([{transform:`translate(${x0}px,${y0}px) scale(.6)`,opacity:0},{transform:`translate(${x0+(Math.random()-.5)*80}px,${y0-60}px) scale(1.2)`,opacity:1,offset:.35},{transform:`translate(${x1}px,${y1}px) scale(.8)`,opacity:1}],{duration:750+j*40,delay:j*70,easing:'cubic-bezier(.5,0,.6,1)',fill:'both'});
    an.onfinish=()=>{c.remove();sfx.tick();bump('pCoins')}}
}
function finish(){
  if(state==='over')return;
  state='over';P={slow:0,magnet:0,x2:0,calm:0};renderPw();$('hint').hidden=true;$('pauseBtn').hidden=true;$('hud').hidden=true;$('abar').hidden=true;
  const endBonus=Math.floor(score/2);const total=run.blocks+run.perf+run.chest+endBonus;
  const isNew=mode!=='daily'&&score>S.best&&score>0;if(isNew)S.best=score;
  const mult=isNew?2:1,final=total*mult;
  const before=S.coins;S.coins+=final;S.gems+=run.gems;
  trackStats();
  const xp=score+perfects*2;const lvBefore=S.lvl;const ups=addXP(xp);const doneM=trackMissions(final);save();
  $('fScore').textContent=score;$('fBest').textContent=S.best;$('newRec').hidden=!isNew;
  const rows=[[t('e_blocks'),'+'+run.blocks],[t('e_perf'),'+'+run.perf]];if(run.chest)rows.push([t('e_chest'),'+'+run.chest]);rows.push([t('e_end'),'+'+endBonus]);
  $('earn').innerHTML=rows.map((r,k)=>`<div style="animation-delay:${k*70}ms">${r[0]} <b>${r[1]}</b></div>`).join('')+(isNew?`<div class="x2" style="animation-delay:${rows.length*70}ms">${t('e_rec')} <b>x2</b></div>`:'')+(run.gems?`<div>${t('e_gems')} <b><i class="gem"></i>+${run.gems}</b></div>`:'')+`<div class="tot" id="totRow" style="animation-delay:${(rows.length+1)*70}ms">${t('total')} <b><i class="coin"></i>${final}</b></div>`;
  $('oXpGain').textContent=`+${xp} XP`;$('oLvl').textContent=lvBefore;$('oBar').style.width='0%';setTimeout(()=>lvlUI('oLvl','oXp','oBar'),350);
  $('oUp').hidden=!ups.length;if(ups.length){const u=ups[ups.length-1];$('oUp').innerHTML=t('lvlUp',u.lvl,ups.reduce((a,r)=>a+r.coins,0))+(ups.some(r=>r.gems)?t('andGems'):'')+ups.filter(r=>r.skin).map(r=>'<br>'+t('newSkin',r.skin)).join('');setTimeout(()=>sfx.fanfare(),700)}
  $('oMis').hidden=!doneM.length;if(doneM.length)$('oMis').innerHTML=t('misDone')+doneM.join(' · ')+'<br>'+t('claimIn');
  $('over').hidden=false;$('gear').hidden=false;if(mode==='daily')dailyAfterRun(score);else rankAfterRun(score);overExtras();cloudAuto();checkAch();
  $('wCoins').textContent=before;$('wGems').textContent=S.gems;
  if(final>0)setTimeout(()=>{flyCoins(final,$('totRow'));let shown=before;const step=Math.max(1,Math.ceil(final/30));const iv=setInterval(()=>{shown=Math.min(S.coins,shown+step);$('wCoins').textContent=shown;if(shown>=S.coins){clearInterval(iv);wallet()}},40)},450);
}

/* ================= ANTI-TRAPAÇA ================= */
// Cada partida guarda um resumo dos toques. No fim, se o padrão for de robô, macro ou jogo alterado,
// a partida vale normalmente pra você (moedas, recorde), mas NÃO entra no ranking mundial.
function runVerdict(sc){
  const r=run||{},why=[];
  if(S.tamper)why.push('save');
  const taps=r.taps||[],errs=(r.errs||[]).filter(e=>!e.mag);
  if(taps.some(tp=>!tp.tr))why.push('synthetic');               // toque falso gerado por script
  if(sc>=30&&r.play<sc*120)why.push('fast');                    // andares demais pro tempo jogado
  if(stack.length-1!==sc)why.push('state');                      // placar não bate com a torre
  if(taps.length>=25){
    const cnt={};let mx=0;taps.forEach(tp=>{const k=tp.x+','+tp.y;cnt[k]=(cnt[k]||0)+1;if(cnt[k]>mx)mx=cnt[k]});
    const iv=[];for(let k=1;k<taps.length;k++)iv.push(taps[k].t-taps[k-1].t);
    const mean=iv.reduce((a,b)=>a+b,0)/iv.length,sd=Math.sqrt(iv.reduce((a,b)=>a+(b-mean)**2,0)/iv.length);
    // sempre no mesmo pixel = autoclick. Com mouse (Chromebook/emulador) o cursor parado é normal,
    // então aí só conta se o ritmo também for regular demais
    const mouse=taps.filter(tp=>tp.pt==='mouse').length>taps.length/2;
    if(mx/taps.length>.8&&(!mouse||(mean>0&&sd/mean<.15)))why.push('samepx');
    if(mean>0&&sd/mean<.03)why.push('rhythm');                   // ritmo perfeito de máquina
  }
  if(errs.length>=120&&errs.filter(e=>e.e>=e.tol).length<=1)why.push('perfect'); // 120 perfeitos quase sem erro
  return why;
}

    const k=monthKey();if(S.lb.mk===k&&S.lb.ms>0&&!(await on.mine(k))){S.lb.ms=0;save()}
    if(S.lb.all===0||S.lb.ms===0)await syncScores()}catch(e){}
  await checkPrize();await checkDailyPrize();await checkOvertakes();snapBelow();checkAch()}
if(window.Online)onlineBoot();else addEventListener('online-ready',onlineBoot);

/* ================= DICAS, ONDAS E COMO JOGAR ================= */
// dica que aparece só na primeira vez (fica guardada no save)
function tip(key,html,where){
  S.tips=S.tips||{};if(S.tips[key])return;S.tips[key]=1;save();
  const el=$('tipB');el.className='tp-'+(where||'mid');el.innerHTML=html;el.hidden=false;
  clearTimeout(tip.t);tip.t=setTimeout(()=>el.hidden=true,4200);
}
// ondas gravitacionais: anéis que saem da linha do bloco e rastro quando acelera (dá pra ler o ritmo)
function drawWaves(y,wd){
  const ph=Math.sin(tNow*WAVE_W),cyc=(tNow*WAVE_W/(Math.PI*2))%1,cy=y+BH/2,amp=waveAmp(wd);
  ctx.save();
  for(let k=0;k<3;k++){const r=(cyc+k/3)%1;const a=(1-r)*(.35+.35*Math.max(0,ph));
    ctx.strokeStyle=ph>0?`rgba(120,230,255,${a})`:`rgba(190,150,255,${a*.7})`;ctx.lineWidth=2+3*(1-r);
    ctx.beginPath();ctx.ellipse(W/2,cy,20+r*W*.75,6+r*46,0,0,Math.PI*2);ctx.stroke()}
  if(moving&&ph>.25){const n=4,dir=moving.dir;ctx.strokeStyle=`rgba(160,240,255,${(ph-.25)*.8})`;ctx.lineWidth=2;
    for(let k=0;k<n;k++){const yy=y+6+k*(BH-12)/(n-1),x0=dir>0?moving.x:moving.x+moving.w,len=18+ph*amp*120;ctx.beginPath();ctx.moveTo(x0-dir*4,yy);ctx.lineTo(x0-dir*(4+len),yy);ctx.stroke()}}
  ctx.restore();
}

/* ---- tela Como jogar ---- */

 {k:'tap',draw(c,w,h){const bw=w*.58,bx=(w-bw)/2;block(bx,h-BH*.9,bw,1,1,c);block(bx+2,h-BH*1.9,bw-4,2,1,c);const mx=bx+16+Math.sin(tNow*.003)*14;block(mx,h-BH*2.9-6,bw-4,3,1,c);

 {k:'worlds',draw(c,w,h){[['#2e78c8','#a0d7f5'],['#06121f','#124650'],['#02010a','#3a1060']].forEach((g0,k)=>{const x=k*w/3,g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,g0[0]);g.addColorStop(1,g0[1]);c.fillStyle=g;c.fillRect(x,0,w/3+1,h)});
   c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=2;for(let k=0;k<3;k++){const yy=18+k*14,xx=((tNow*.05+k*20)%(w/3));c.beginPath();c.moveTo(xx,yy);c.lineTo(xx+14,yy);c.stroke()}
   c.strokeStyle='rgba(90,255,170,.8)';c.beginPath();for(let X=w/3;X<2*w/3;X+=3)c.lineTo(X,h/2+Math.sin(X*.15+tNow*.003)*8);c.stroke();
   const r=((tNow*WAVE_W/(Math.PI*2))%1);c.strokeStyle=`rgba(120,230,255,${1-r})`;c.beginPath();c.ellipse(w*5/6,h/2,4+r*14,2+r*9,0,0,7);c.stroke()}},
 {k:'rank',draw(c,w,h){c.fillStyle='#ffc23d';c.save();c.translate(w/2-24,h/2-26);c.scale(2,2);c.fill(new Path2D('M7 3h10v3h3v2a4 4 0 0 1-4 4 5 5 0 0 1-3 2.7V17h3v3H8v-3h3v-2.3A5 5 0 0 1 8 12a4 4 0 0 1-4-4V6h3zM4 8a2 2 0 0 0 3 1.7V8zm16 0h-3v1.7A2 2 0 0 0 20 8z'));c.restore()}},
];
let helpBack='menu',helpRAF=0;
function openHelp(from){helpBack=from;if(from==='pause')$('pause').hidden=true;else $('menu').hidden=true;$('help').hidden=false;
  $('hcards').innerHTML=HELP.map((h,k)=>`<div class="hcard" style="animation-delay:${k*60}ms"><canvas></canvas><div><b>${t('h_'+h.k+'T')}</b><span>${t('h_'+h.k+'P')}</span></div></div>`).join('');
  const cvs=[...$('hcards').querySelectorAll('canvas')];cancelAnimationFrame(helpRAF);
  const loop=()=>{if($('help').hidden)return;cvs.forEach((cv,k)=>{const r=cv.getBoundingClientRect();if(!r.width)return;const pw=Math.round(r.width*DPR),ph=Math.round(r.height*DPR);if(cv.width!==pw){cv.width=pw;cv.height=ph}const c=cv.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,r.width,r.height);HELP[k].draw(c,r.width,r.height)});helpRAF=requestAnimationFrame(loop)};loop();
}
$('openHelp').onclick=()=>openHelp('menu');$('pauseHelp').onclick=()=>openHelp('pause');
$('closeHelp').onclick=()=>{$('help').hidden=true;cancelAnimationFrame(helpRAF);if(helpBack==='pause')$('pause').hidden=false;else showMenu()};

/* ================= SAVE NA NUVEM (Google Play Games) ================= */
// O save vai selado pra nuvem. Ao carregar, o selo é conferido (save editado é recusado).
const CL=()=>window.Native&&window.Native.isNative&&window.Native.cloud?window.Native.cloud:null;
let clPlayer=null,clLast=0,clBusy=false,clBootDone=false,clCloudProg=null;
// "tamanho" do progresso (nível e XP só aumentam jogando) — usado pra nunca salvar por cima de um progresso maior
const progOf=s=>(s.lvl||1)*1e6+(s.xp||0);
function clPayload(){save();let d,h;try{d=localStorage.getItem('empilha_save');h=localStorage.getItem('empilha_sig')}catch(e){}return JSON.stringify({v:1,d,h})}
function clParse(txt){try{const o=JSON.parse(txt||'');if(!o||!o.d||!o.h||SEAL(o.d)!==o.h)return null;const s=JSON.parse(o.d);return {o,s}}catch(e){return null}}
function clDesc(s){return t('clDesc',s.lvl||1,s.best||0)}
function clRender(){const box=$('cloudBox');if(!box)return;const c=CL();box.hidden=!c;if(!c)return;
  $('clSt').innerHTML=clPlayer?`<span class="dotok"></span>${t('clOn',esc(clPlayer))}`:`<span class="dotoff"></span>${t('clOff')}`;
  $('clSign').hidden=!!clPlayer;$('clSave').disabled=clBusy;$('clLoad').disabled=clBusy}
async function clSignIn(interactive){const c=CL();if(!c)return false;
  let r=null;try{r=await c.signIn(interactive);clPlayer=r&&r.signedIn?(r.name||'Play Games'):null}catch(e){clPlayer=null;r={error:String(e&&e.message||e)}}
  if(interactive&&!clPlayer&&r&&r.error)toast(t('clErr',String(r.error).slice(0,90)));
  if(clPlayer&&r.name&&typeof setPlayName==='function')setPlayName(r.name);
  if(clPlayer)try{pgsSyncAll()}catch(e){}
  clRender();return !!clPlayer}
async function clSaveNow(manual){const c=CL();if(!c||clBusy)return;
  if(!clPlayer&&!(await clSignIn(manual))){if(manual)toast(t('clNeedSign'));return}
  clBusy=true;clRender();
  try{await c.save(clPayload(),clDesc(S),progOf(S));clLast=Date.now();clCloudProg=progOf(S);if(manual){sfx.coin();toast(t('clSaved'))}}
  catch(e){if(manual)toast(t('clFail'))}
  clBusy=false;clRender()}
// salva sozinho no fim das partidas e ao sair do app (no máximo 1x por minuto)
// (só depois de comparar com a nuvem, e nunca por cima de um progresso maior)
function cloudAuto(){if(!clPlayer||!clBootDone||(clCloudProg!=null&&progOf(S)<clCloudProg))return;if(Date.now()-clLast>60000)clSaveNow(false)}
async function clLoadNow(manual){const c=CL();if(!c||clBusy)return;
  if(!clPlayer&&!(await clSignIn(manual))){if(manual)toast(t('clNeedSign'));return}
  clBusy=true;clRender();let r=null;
  try{r=await c.load()}catch(e){}
  clBusy=false;clRender();
  if(!r||!r.data){if(manual)toast(t('clEmpty'));return}
  const p=clParse(r.data);if(!p){if(manual)toast(t('clBad'));return}
  clAsk(p);
}
function clAsk(p){const s=p.s;$('clAskP').innerHTML=t('clAskP',s.lvl||1,s.best||0,s.coins||0,s.gems||0);$('clAsk').hidden=false;
  $('clYes').onclick=async()=>{$('clAsk').hidden=true;restoring=true;clearTimeout(mirT);mirT=0;try{localStorage.setItem('empilha_save',p.o.d);localStorage.setItem('empilha_sig',p.o.h);localStorage.setItem('empilha_bak',p.o.d);localStorage.setItem('empilha_bak_sig',p.o.h)}catch(e){return}
    // atualiza também o espelho do backup do Android, senão ele "restauraria" o save antigo por cima
    const NN=window.Native;try{if(NN&&NN.prefSet){await NN.prefSet('bs_save',p.o.d);await NN.prefSet('bs_sig',p.o.h)}}catch(e){}
    location.reload()};
  // recusou: vale o progresso deste celular (pode salvar por cima)
  $('clNo').onclick=()=>{$('clAsk').hidden=true;clCloudProg=progOf(S)}}
$('clSave').onclick=()=>clSaveNow(true);$('clLoad').onclick=()=>clLoadNow(true);$('clSign').onclick=()=>clSignIn(true).then(ok=>{if(ok){toast(t('clHi',clPlayer));if(!clBootDone)clCompare()}});
// ao abrir: entra em silêncio e, se este celular estiver "novo" e a nuvem tiver progresso, oferece recuperar
(async()=>{if(!CL())return;clRender();
  if(!(await clSignIn(false))){
    // 1ª vez que abre o jogo: chama a tela do Play Games uma única vez (depois fica só o botão Entrar)
    let first=false;try{first=!localStorage.getItem('bs_clauto');localStorage.setItem('bs_clauto','1')}catch(e){}
    if(!first)return;await new Promise(r=>setTimeout(r,1200));if(!(await clSignIn(true)))return;toast(t('clHi',clPlayer))}
  clCompare()})();
// compara com a nuvem ao entrar: se lá tiver mais progresso, oferece recuperar (quando estiver no menu)
async function clCompare(){if(clBusy)return;clBusy=true;let p=null,ok=false;
  try{const r=await CL().load();ok=true;p=r&&r.data?clParse(r.data):null}catch(e){}
  clBusy=false;clRender();if(!ok)return;
  clCloudProg=p?progOf(p.s):0;clBootDone=true;
  if(p&&(p.s.best||0)>0&&(!BOOT_LOCAL||progOf(p.s)>progOf(S)))whenMenu(()=>clAsk(p))}

/* ================= LOOP ================= */
let wasPlaying=false;
function frame(tt){
  requestAnimationFrame(frame);tNow=tt||0;
  if((state==='play')!==wasPlaying){wasPlaying=state==='play';N&&N.setPlaying&&N.setPlaying(wasPlaying)}
  const dt=Math.min(3,Math.max(.2,(tNow-lastT)/16.667||1));lastT=tNow;const scale=W/360;
  cam+=(camT-cam)*Math.min(1,.12*dt);skyF+=(score-skyF)*.03;
  const wd=worldOf(score);
  if(state==='play'&&run)run.play+=dt*16.667;
  if(state==='play'&&moving){
    let sp=speed*(P.slow>0?.55:1);
    if(P.calm<=0){if(wd===1)sp*=1+.55*Math.sin(tNow*.0028);if(wd===2)sp*=moving.v;if(wd>=3)sp*=1+waveAmp(wd)*Math.sin(tNow*WAVE_W)}
    moving.x+=moving.dir*sp*dt*scale;
    if(!moving.entered){const tp=stack[stack.length-1];if(tp&&Math.min(moving.x+moving.w,tp.x+tp.w)-Math.max(moving.x,tp.x)>0)moving.entered=true}
    if(moving.x>W-moving.w*.2&&moving.dir>0)moving.dir=-1;if(moving.x<-moving.w*.8&&moving.dir<0)moving.dir=1;
  }
  if(state==='menu'&&moving){moving.x+=moving.dir*2*dt*scale;if(moving.x>W-moving.w)moving.dir=-1;if(moving.x<0)moving.dir=1}
  drawWorld();
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.3)shake=0}
  // torre balança de leve quando um bloco cai
  const la=tNow-landT,bounce=la<500?3.5*Math.exp(-la/110)*Math.sin(la/28):0;
  const first=Math.max(0,stack.length-Math.ceil(H/BH)-2);
  const top=stack[stack.length-1];
  drawStack(first,(k,b)=>yOf(b.i)+bounce*(k/stack.length));
  drawRival();
  if(moving&&(state==='play'||state==='menu'||state==='pause'||state==='ad')){
    const y=yOf(moving.i);
    // sombra do bloco sobre a torre
    if(top){const l=Math.max(moving.x,top.x),r=Math.min(moving.x+moving.w,top.x+top.w);if(r>l){ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(l,yOf(top.i),r-l,4)}}
    block(moving.x,y,moving.w,moving.i);
    if(moving.pw){const pw=POWERS[moving.pw];const p=.5+.5*Math.sin(tNow*.01);ctx.save();ctx.strokeStyle=pw.col;ctx.globalAlpha=.6+.4*p;ctx.lineWidth=3;rr(ctx,moving.x-2,y-2,moving.w+4,BH+4,7);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=pw.col;const lb='★ '+t('p_'+moving.pw);for(let k=0;k<4;k++){const a=tNow*.004+k*Math.PI/2,sx=moving.x+moving.w/2+Math.cos(a)*(moving.w/2+8),sy=y+BH/2+Math.sin(a)*(BH/2+8),r=2.5+1.5*Math.sin(tNow*.01+k);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(sx,sy-r*2);ctx.lineTo(sx+r*.6,sy);ctx.lineTo(sx,sy+r*2);ctx.lineTo(sx-r*.6,sy);ctx.fill()}ctx.fillStyle=pw.col;ctx.font='900 13px Nunito, sans-serif';const tw=Math.max(60,ctx.measureText(lb).width+20);rr(ctx,moving.x+moving.w/2-tw/2,y+7,tw,20,10);ctx.fill();ctx.fillStyle='#1a1030';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lb,moving.x+moving.w/2,y+17.5);ctx.restore()}
    if(wd>=3&&state==='play'&&P.calm<=0)drawWaves(y,wd);
    if(wd===1&&state==='play'&&P.calm<=0){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;for(let k=0;k<5;k++){const lx=((tNow*.4*windDir+k*137)%(W+120)+W+120)%(W+120)-60,ly=y-60+k*28;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+40,ly);ctx.stroke()}}
  }
  // anéis do perfeito
  for(let k=rings.length-1;k>=0;k--){const r=rings[k],a=tNow-r.t0;if(a>450){rings.splice(k,1);continue}const e=a*.09;ctx.save();ctx.globalAlpha=1-a/450;ctx.strokeStyle='#fff';ctx.lineWidth=3*(1-a/450)+1;rr(ctx,r.x-e,yOf(r.i)-e*.6,r.w+e*2,BH+e*1.2,8);ctx.stroke();ctx.restore()}
  for(let k=debris.length-1;k>=0;k--){const d=debris[k];d.vy+=.5*dt;d.y+=d.vy*dt;d.x+=d.vx*dt;d.r+=d.vr*dt;ctx.save();ctx.translate(d.x+d.w/2,d.y+BH/2);ctx.rotate(d.r);ctx.translate(-(d.x+d.w/2),-(d.y+BH/2));block(d.x,d.y,d.w,d.i,.9);ctx.restore();if(d.y>H+200)debris.splice(k,1)}
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.vy+=.15*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=.025*dt;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.col;const s=6*p.l+2;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);if(p.l<=0)parts.splice(k,1)}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  for(let k=floats.length-1;k>=0;k--){const f=floats[k];f.y-=1.1*dt;f.l-=.018*dt;ctx.globalAlpha=Math.max(0,f.l);const sc=f.l>.85?1+(f.l-.85)*2:1;ctx.font=`900 ${f.size*sc}px Nunito, sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);if(f.l<=0)floats.splice(k,1)}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.1})`;ctx.fillRect(0,0,W,H);flash-=.08*dt}
  if(!$('shop').hidden)drawPreviews();
}

let lastTap=0;
const tap=e=>{if(state!=='play')return;e.preventDefault();if(e.isPrimary===false)return;const n=performance.now();if(n-lastTap<110)return;lastTap=n;
  if(run&&run.taps&&run.taps.length<3000)run.taps.push({t:n,x:Math.round(e.clientX),y:Math.round(e.clientY),tr:e.isTrusted!==false,pt:e.pointerType||''});drop()};
cv.addEventListener('pointerdown',tap);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='play')drop();else if(state==='menu')startGame()}if(e.code==='Escape'){state==='play'?pauseGame():state==='pause'&&resumeGame()}});
$('play').onclick=()=>{mode='normal';startGame()};$('again').onclick=()=>{if(mode==='daily'&&dailyInfo().tries<DAILY_TRIES)startDaily();else{mode='normal';startGame()}};

/* ================= INTRO ================= */
function runIntro(done){
  const el=$('intro'),img=$('studioImg');
  img.onload=()=>{img.hidden=false;$('studioWord').hidden=true};img.onerror=()=>{img.hidden=true};
  if(img.complete&&img.naturalWidth){img.hidden=false;$('studioWord').hidden=true}
  let ended=false;const end=()=>{if(ended)return;ended=true;el.classList.add('out');setTimeout(()=>{el.remove()},550);done()};
  el.addEventListener('pointerdown',end);setTimeout(end,2300);
}

addEventListener('resize',resize);resize();
SKINS.forEach(sk=>{if(sk.cur==='lvl'&&sk.price<=S.lvl&&!S.owned.includes(sk.id))S.owned.push(sk.id)});save();
applyLang();wallet();ensureMissions();showMenu();
requestAnimationFrame(frame);
// aquece o desenho da skin durante a abertura (a 1ª partida não engasga)
setTimeout(()=>{try{bcSync();const wc=document.createElement('canvas');wc.width=400;wc.height=BH*2;const c=wc.getContext('2d');for(let k=0;k<40;k++){tNow+=16;block(0,0,300,k,1,c)}}catch(e){}},300);
runIntro(()=>{buildLogo();if(dailyReady()){$('menu').hidden=true;$('mis').hidden=false;renderMis()}});
if(N){
  N.initAds();
  N.initBilling(PRODUCT_IDS,(id,tok)=>{if(grantPack(id,tok))toast(t('buyDelivered'))}).then(prices=>{PACKS.forEach(p=>{if(prices[p.id])p.price=prices[p.id]});if(!$('shop').hidden)renderShop()});
  N.onPause&&N.onPause(()=>{if(state==='play')pauseGame();if(state==='revive'&&!$('revive').hidden)clearInterval(revTimer);A.ctx&&A.ctx.suspend();flushMirror();cloudAuto()});
  N.onBack(()=>{
    if(!$('clAsk').hidden){$('clNo').click();return}
    if(!$('rkWin').hidden){$('rkWinOk').click();return}
    if(!$('ovt').hidden){$('ovtNo').click();return}
    if(!$('pp').hidden){showMenu();return}
    if(state==='revive'&&!$('revive').hidden){$('revSkip').click();return}
    if(!$('rkWin').hidden){$('rkWinOk').click();return}
    if(!$('buy').hidden){$('buy').hidden=true;return}
    if(!$('prof').hidden){$('pfCancel').click();return}
    if(!$('rank').hidden){$('closeRank').click();return}
    if(!$('help').hidden){$('closeHelp').click();return}
    if(!$('settings').hidden){$('closeSet').click();return}
    if(!$('shop').hidden){$('closeShop').click();return}
    if(!$('mis').hidden){showMenu();return}
    if(!$('over').hidden){showMenu();return}
    if(state==='play'){pauseGame();return}
    if(state==='pause'){resumeGame();return}
    if(state==='menu'){N.exitApp();return}
  });
}
})();
