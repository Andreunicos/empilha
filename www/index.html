<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1024">
<title>Big Stack</title>
<style>
  @font-face{font-family:"Bungee";src:url(fonts/bungee.woff2) format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Nunito";src:url(fonts/nunito-600.woff2) format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Nunito";src:url(fonts/nunito-800.woff2) format("woff2");font-weight:800;font-display:swap}
  @font-face{font-family:"Nunito";src:url(fonts/nunito-900.woff2) format("woff2");font-weight:900;font-display:swap}
  *{box-sizing:border-box}
  :root{color-scheme:dark;--bg:#0f1024;--card:#1c1b3a;--card2:#2a2852;--line:rgba(255,255,255,.1);--ink:#fff7e8;--muted:#b3b0d4;--sun:#ffc23d;--sunD:#c98a00;--pink:#ff5d8f;--pinkD:#b3285a;--gem:#5ee0ff;--gemD:#1d9bc0;--ok:#4fe39a;--okD:#1f9c62;--vio:#8b7bff;--vioD:#3a2699;
    --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{font-family:"Nunito",system-ui,sans-serif}
  #wrap{position:absolute;top:var(--sat);bottom:var(--sab);left:0;right:0;max-width:520px;margin:0 auto;overflow:hidden}
  canvas#c{display:block;width:100%;height:100%}
  .coin{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2a8,var(--sun) 45%,var(--sunD));box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);vertical-align:-.1em;flex:none}
  .gem{display:inline-block;width:.72em;height:.72em;transform:rotate(45deg);background:linear-gradient(135deg,#d9f8ff,var(--gem) 50%,var(--gemD));border-radius:2px;vertical-align:-.02em;margin-inline:.12em;flex:none}
  .wallet{position:absolute;top:14px;left:14px;display:flex;gap:8px;z-index:6;pointer-events:none}
  .pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);border-radius:999px;padding:6px 12px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;transition:transform .15s}
  .pill.bump{transform:scale(1.15)}
  .icon-btn{position:absolute;top:10px;right:12px;z-index:7;width:42px;height:42px;border-radius:14px;border:0;background:rgba(0,0,0,.4);color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn svg{width:22px;height:22px}
  .hud{position:absolute;top:56px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
  #score{font-family:"Bungee",Impact,sans-serif;font-size:64px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35)}
  #score.pop{animation:spop .25s ease-out}
  @keyframes spop{0%{transform:scale(1.28)}100%{transform:scale(1)}}
  #combo{font-family:"Bungee",Impact,sans-serif;font-size:18px;color:var(--sun);min-height:22px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  #combo.pop{animation:cpop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes cpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  #pw{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-inline:16px}
  .chip{font:900 12px "Nunito",sans-serif;letter-spacing:.06em;padding:4px 9px;border-radius:999px;color:#1a1030;animation:cpop .4s}
  #hint{position:absolute;left:0;right:0;bottom:30%;text-align:center;font-weight:900;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85);pointer-events:none;animation:blink 1.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  #banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-family:"Bungee",Impact,sans-serif;text-shadow:0 4px 0 rgba(0,0,0,.35);animation:ban 2.4s ease forwards}
  #banner small{display:block;font-size:14px;letter-spacing:.2em;color:var(--sun)}
  #banner span{font-size:40px}
  @keyframes ban{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.05)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
  /* barra de habilidades */
  #abar{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:16px;z-index:5;pointer-events:none;animation:pin .4s cubic-bezier(.2,1.3,.4,1)}
  .ab{pointer-events:auto;position:relative;width:60px;height:60px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.35);transition:transform .1s;touch-action:manipulation}
  .ab:active{transform:scale(.88)}
  .ab svg{width:30px;height:30px;pointer-events:none}
  .ab .bd{position:absolute;top:-5px;right:-5px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font:900 13px "Nunito",sans-serif;color:#fff;background:#e53950;border:2px solid #fff;padding:0 5px;pointer-events:none}
  .ab .bd.plus{background:#2fbf5b;font-size:19px;line-height:1}
  .ab .lbl{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font:900 10px "Nunito",sans-serif;letter-spacing:.05em;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;pointer-events:none}
  .ab.on{animation:abpulse .7s ease-in-out infinite alternate}
  .ab.spent{filter:grayscale(.85) brightness(.75)}
  .ab.idle{filter:grayscale(.7) brightness(.7);opacity:.7}
  .ab .bd.spent{background:#5b5670;font-size:12px}
  .ab.nope{animation:abnope .35s}
  @keyframes abnope{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  @keyframes abpulse{to{box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35),0 0 0 6px rgba(255,255,255,.35)}}
  .a-magnet{background:linear-gradient(160deg,#ff7a9c,#e0305a)}.a-slow{background:linear-gradient(160deg,#6fd0ff,#2a86d8)}.a-wide{background:linear-gradient(160deg,#6ff0a8,#1fa864)}.a-calm{background:linear-gradient(160deg,#c7b3ff,#7a5ae0)}
  .pwr{flex-direction:row!important;align-items:center!important;text-align:left;gap:12px!important}
  .pwr .ico{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35)}
  .pwr .ico svg{width:26px;height:26px}
  .pwr .inf{flex:1;display:flex;flex-direction:column;gap:3px}
  .pwr .ds{font-size:12px;color:var(--muted);font-weight:800}
  .pwr .own{font-size:12px;color:var(--sun);font-weight:900}
  .pwr .bts{display:flex;flex-direction:column;gap:8px}
  #grid.list{grid-template-columns:1fr}
  /* panels */
  .panel{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:64px 18px 24px;text-align:center;background:linear-gradient(180deg,rgba(15,16,36,.15) 0%,rgba(15,16,36,.82) 38%,rgba(15,16,36,.95) 100%);animation:pfade .25s ease-out}
  .inner{margin-block:auto;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;animation:pin .4s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pfade{from{opacity:0}}
  @keyframes pin{from{opacity:0;transform:translateY(18px) scale(.96)}}
  .panel h2{font-family:"Bungee",Impact,sans-serif;font-size:28px;margin:0}
  .panel p{margin:0;color:var(--muted);font-size:15px;max-width:32ch}
  .big-title{font-family:"Bungee",Impact,sans-serif;font-size:clamp(44px,14vw,68px);margin:0;line-height:.95;color:var(--sun);text-shadow:0 5px 0 var(--pink)}
  /* logo tiles */
  .logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0}
  .logo .ln{display:flex;gap:6px}
  .logo i{font-style:normal;font-family:"Bungee",Impact,sans-serif;font-size:clamp(30px,10.5vw,50px);width:1.22em;height:1.22em;display:grid;place-items:center;border-radius:.22em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);box-shadow:inset 0 .12em 0 rgba(255,255,255,.35),inset 0 -.14em 0 rgba(0,0,0,.25),0 .12em 0 rgba(0,0,0,.35);animation:tdrop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*70ms)}
  .logo.idle i{animation:tbob 3s ease-in-out infinite;animation-delay:calc(var(--i)*120ms)}
  @keyframes tdrop{0%{transform:translateY(-120px) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:none}}
  @keyframes tbob{50%{transform:translateY(-4px)}}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{position:relative;font-family:"Bungee",Impact,sans-serif;font-size:20px;color:#1a1030;background:var(--sun);border:0;border-radius:14px;padding:13px 26px;box-shadow:0 5px 0 var(--sunD);cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sunD)}
  .btn:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible,.sw:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .btn.play{font-size:26px;padding:16px 48px;animation:breathe 2.2s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.05)}}
  .btn.alt{background:var(--card2);color:var(--ink);box-shadow:0 5px 0 #0b0a1f}
  .btn.gemb{background:var(--gem);box-shadow:0 5px 0 var(--gemD)}
  .btn.pinkb{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pinkD)}
  .btn.okb{background:var(--ok);box-shadow:0 5px 0 var(--okD)}
  .btn.sm{font-size:15px;padding:10px 16px;border-radius:12px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn svg{width:18px;height:18px}
  .dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:2px solid var(--bg);animation:blink 1.4s infinite}
  .link{background:none;border:0;color:var(--muted);font:800 15px "Nunito",sans-serif;text-decoration:underline;cursor:pointer;padding:8px}
  .lvl{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;width:min(100%,320px)}
  .badge{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,var(--vio),#5a3fd6);font-family:"Bungee",Impact,sans-serif;font-size:20px;box-shadow:0 3px 0 var(--vioD)}
  .lvl .info{flex:1;display:flex;flex-direction:column;gap:5px;text-align:left}
  .lvl .t{display:flex;justify-content:space-between;font-weight:900;font-size:14px}
  .lvl .t span{color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--vio),#c19bff);transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .bar.g i{background:linear-gradient(90deg,var(--ok),#a8ffcf)}
  .ring{position:relative;width:110px;height:110px}
  .ring svg{transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bungee",Impact,sans-serif;font-size:40px}
  .earn{background:var(--card);border-radius:16px;padding:14px 18px;width:min(100%,320px);display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
  .earn div{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--muted);animation:pin .35s both}
  .earn div b{color:var(--ink);display:flex;align-items:center;gap:4px}
  .earn .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-size:18px;color:var(--ink)}
  .earn .x2,.earn .x2 b{color:var(--pink)}
  .stats{display:flex;gap:28px;font-variant-numeric:tabular-nums}
  .stats div{display:flex;flex-direction:column}
  .stats b{font-family:"Bungee",Impact,sans-serif;font-size:32px}
  .stats span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .hot{font-family:"Bungee",Impact,sans-serif;color:var(--pink);font-size:17px;animation:pop .6s ease-in-out infinite alternate}
  .up{background:linear-gradient(160deg,var(--vio),#5a3fd6);border-radius:14px;padding:10px 16px;font-weight:900;width:min(100%,320px);animation:pin .5s .3s both}
  @keyframes pop{to{transform:scale(1.08)}}
  .top{display:flex;width:100%;justify-content:space-between;align-items:center}
  .tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
  .tab{background:none;border:0;color:var(--muted);font:900 15px "Nunito",sans-serif;padding:9px 18px;border-radius:10px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--card2);color:var(--ink)}
  .full{background:rgba(15,16,36,.97);justify-content:flex-start}
  .full .inner{margin-block:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%}
  .item{background:var(--card);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch;border:2px solid transparent;animation:pin .35s both}
  .item.on{border-color:var(--ok)}
  .item canvas{width:100%;height:84px;border-radius:10px;background:#15142f}
  .item .nm{font-weight:900;font-size:15px}
  .item .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:-6px}
  .item .btn{font-size:14px;padding:9px 8px;border-radius:10px}
  .item .btn.used{background:var(--ok);box-shadow:0 4px 0 var(--okD)}
  .pack .big{font-family:"Bungee",Impact,sans-serif;font-size:28px;padding-block:16px;display:flex;justify-content:center;align-items:center;gap:4px}
  .pack .best{font-size:11px;font-weight:900;letter-spacing:.1em;color:#fff;background:var(--pink);border-radius:6px;padding:2px 6px;align-self:center}
  .note{font-size:12px!important;color:var(--muted);max-width:40ch;margin-inline:auto!important}
  .sec{width:100%;text-align:left;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%}
  .day{background:var(--card);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:900;color:var(--muted);border:2px solid transparent}
  .day b{font-size:13px;color:var(--ink);display:flex;align-items:center}
  .day.done{opacity:.45}
  .day.now{border-color:var(--sun);color:var(--sun);animation:pop .7s ease-in-out infinite alternate}
  .mis{background:var(--card);border-radius:14px;padding:12px 14px;width:100%;display:flex;gap:12px;align-items:center;text-align:left;animation:pin .35s both}
  .mis .info{flex:1;display:flex;flex-direction:column;gap:6px}
  .mis .nm{font-weight:900;font-size:15px}
  .mis .pr{font-size:12px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
  .mis .btn{font-size:13px;padding:9px 10px;border-radius:10px;min-width:84px}
  /* dicas e como jogar */
  #tipB{position:absolute;left:50%;transform:translateX(-50%);z-index:9;width:min(88%,330px);background:#fff7e8;color:#1a1030;border-radius:16px;padding:12px 14px;font:900 15px/1.3 "Nunito",sans-serif;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45);pointer-events:none;animation:tipin .45s cubic-bezier(.2,1.5,.4,1)}
  #tipB::after{content:"";position:absolute;left:50%;margin-left:-9px;border:9px solid transparent}
  #tipB.tp-bar{bottom:104px}#tipB.tp-bar::after{top:100%;border-top-color:#fff7e8}
  #tipB.tp-mid{top:24%}#tipB.tp-mid::after{top:100%;border-top-color:#fff7e8}
  #tipB b{color:#b3285a}
  @keyframes tipin{from{opacity:0;transform:translate(-50%,14px) scale(.9)}}
  .help-link{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:16px}
  .help-link .q{width:24px;height:24px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-family:"Bungee",Impact,sans-serif;font-size:14px}
  .hcards{width:100%;display:flex;flex-direction:column;gap:10px}
  .hcard{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left;animation:pin .35s both}
  .hcard canvas{width:96px;height:84px;flex:none;border-radius:12px;background:#15142f}
  .hcard b{display:block;font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:16px;margin-bottom:3px}
  .hcard span{font-size:14px;color:var(--muted);font-weight:800;line-height:1.35}
  /* ranking */
  .btn.rankb{background:linear-gradient(160deg,#ffd76a,#f0a91c);box-shadow:0 5px 0 #b9780a;display:flex;align-items:center;gap:8px;padding-inline:22px}
  .btn.rankb svg{width:20px;height:20px}
  .orank{border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;width:min(100%,320px);display:flex;justify-content:center;gap:16px;font:800 15px "Nunito",sans-serif;cursor:pointer;animation:pin .4s both}
  .orank b{font-family:"Bungee",Impact,sans-serif;color:var(--sun);font-weight:400}
  .rme-btn{border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;width:100%;display:flex;align-items:center;gap:10px;font:900 17px "Nunito",sans-serif;cursor:pointer;text-align:left}
  .rme-btn .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rme-btn svg{width:20px;height:20px;color:var(--muted)}
  .fl{font-size:22px;line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
  .rtab{background:none;border:0;color:var(--muted);font:900 15px "Nunito",sans-serif;padding:9px 22px;border-radius:10px;cursor:pointer}
  .rtab[aria-selected="true"]{background:var(--card2);color:var(--ink)}
  .rprize{width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;background:linear-gradient(160deg,rgba(255,194,61,.18),rgba(255,93,143,.14));border:1.5px solid rgba(255,194,61,.45);border-radius:14px;padding:10px 12px;font-weight:900}
  .rprize .tro{width:24px;height:24px}
  .rprize b{color:var(--gem);display:inline-flex;align-items:center}
  .rprize small{width:100%;font-size:12px;color:var(--muted);font-weight:800}
  .rlist{width:100%;display:flex;flex-direction:column;gap:6px}
  .rlist.mine{border-top:1px dashed var(--line);padding-top:8px}
  .rrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:900;animation:pin .3s both}
  .rrow .pos{width:34px;text-align:center;font-family:"Bungee",Impact,sans-serif;font-weight:400;color:var(--muted);font-size:14px}
  .rrow .pos i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#1a1030;font-size:15px}
  .rrow.p1 .pos i{background:linear-gradient(160deg,#fff1a6,#f5c542 55%,#c98a00)}
  .rrow.p2 .pos i{background:linear-gradient(160deg,#ffffff,#c9cfe0 55%,#8d94ab)}
  .rrow.p3 .pos i{background:linear-gradient(160deg,#ffd2a6,#e0914a 55%,#9c5620)}
  .rrow.p1{background:linear-gradient(90deg,rgba(255,194,61,.22),var(--card))}
  .rrow .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
  .rrow .sc{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
  .rrow.me{background:linear-gradient(90deg,rgba(79,227,154,.28),var(--card2));outline:2px solid var(--ok)}
  .rempty{color:var(--muted);font-weight:800;padding:26px 10px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .rempty.sm{padding:10px}
  .spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--sun);animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  .sw{width:52px;height:30px;border-radius:99px;border:0;background:#3a3860;position:relative;cursor:pointer;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
  .sw[aria-checked="true"]{background:var(--ok)}
  .sw[aria-checked="true"]::after{transform:translateX(22px)}
  .seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;flex-wrap:wrap}
  .seg button{flex:1;border:0;background:none;color:var(--muted);font:900 14px "Nunito",sans-serif;padding:8px 10px;border-radius:9px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--card2);color:var(--ink)}
  .ver{font-size:12px;color:var(--muted)}
  /* intro */
  #intro{position:fixed;inset:0;z-index:20;background:#0b0b1a;display:grid;place-items:center;transition:opacity .5s}
  #intro.out{opacity:0;pointer-events:none}

  #intro small{font-weight:900;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);font-size:12px}
  @keyframes iin{from{opacity:0;transform:scale(.85);filter:blur(6px)}}
  #ad{z-index:9;background:#000}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);buildCity()}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const VERSION=(window.EMPILHA_CONFIG&&window.EMPILHA_CONFIG.version)||'1.1';

/* ================= SAVE ================= */
const DEF_SET={music:true,musicVol:55,sfx:true,sfxVol:85,vib:true,lang:''};
const DEF={coins:120,gems:0,best:0,owned:['classic'],skin:'classic',xp:0,lvl:1,daily:{last:'',streak:0},mday:'',missions:[],settings:DEF_SET,inv:{magnet:1,slow:1,wide:1,calm:1}};
// save com selo: se alguém editar o arquivo à mão, o selo não bate e o jogo usa a cópia de segurança
const cyrb=(str,seed)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const SEAL=(d)=>cyrb('bSk·'+d+'·'+d.length,0x5bd1e995);
// valores impossíveis viram valores válidos (proteção contra save quebrado)
const fixNum=(v,min=0,max=1e9)=>{v=Math.floor(+v);return Number.isFinite(v)?Math.min(max,Math.max(min,v)):min};
function loadSave(){
  const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const main=get('empilha_save'),sig=get('empilha_sig'),bak=get('empilha_bak'),bsig=get('empilha_bak_sig');
  const parse=d=>{try{return JSON.parse(d)}catch(e){return null}};
  if(main&&sig&&SEAL(main)===sig)return parse(main)||{};
  if(bak&&bsig&&SEAL(bak)===bsig){const d=parse(bak);if(d)return d}
  if(main&&!sig)return parse(main)||{}; // save antigo (antes do selo): aceita e sela
  if(main){const d=parse(main)||{};d.tamper=1;return d} // editado e sem cópia boa: segue, mas fora do ranking
  return {};
}
const BOOT_LOCAL=(()=>{try{return !!localStorage.getItem('empilha_save')}catch(e){return false}})();
let S;try{S=Object.assign({},DEF,loadSave())}catch(e){S=JSON.parse(JSON.stringify(DEF))}
const BOOT_CLK=S.clk||0;
S.settings=Object.assign({},DEF_SET,S.settings||{});S.inv=Object.assign({magnet:0,slow:0,wide:0,calm:0},S.inv||{magnet:1,slow:1,wide:1,calm:1});for(const k in S.inv)S.inv[k]=fixNum(S.inv[k],0,999);if(!Array.isArray(S.owned))S.owned=['classic'];
const save=()=>{try{S.clk=Math.max(S.clk||0,Date.now());const d=JSON.stringify(S),h=SEAL(d);localStorage.setItem('empilha_save',d);localStorage.setItem('empilha_sig',h);localStorage.setItem('empilha_bak',d);localStorage.setItem('empilha_bak_sig',h);mirrorSave(d,h)}catch(e){}};
// espelho no armazenamento nativo (backup automático do Google): gravado no máximo a cada 3 s

}

function env(g,t0,a,peak,d){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d)}

function noise(t0,dur,peak,dest,type='bandpass',f=1800,q=1,f2){const ac=A.ctx,s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=A.noise;fl.type=type;fl.frequency.setValueAtTime(f,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+dur);fl.Q.value=q;env(g,t0,.003,peak,dur);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t0);s.stop(t0+dur+.05)}

/* ================= GAME ================= */
const BASEW=0.62;
let stack=[],moving=null,debris=[],parts=[],floats=[],rings=[],cam=0,camT=0,score=0,combo=0,perfects=0,maxCombo=0,state='menu',speed=4.2,shake=0,flash=0,lastT=0,landT=-1e9;
// começo mais fácil: até o andar 20 o bloco é mais lento e o perfeito é mais generoso
const ease=()=>Math.min(1,score/20);
const perfTol=()=>Math.max(6,speed*1.1)*(W/360)*(1.8-.8*ease());
const SPEED0=4.2,SPEED_STEP=.06,SPEED_MAX=9,SPEED_MAX_SPACE=10;
const WAVE_W=Math.PI*2/2400; // ondas gravitacionais: 1 ciclo a cada 2,4 s
const waveAmp=wd=>Math.min(.45,.28+(wd-3)*.04);

function reset(){

  stack=[{x:(W-w)/2,w,i:0,t0:-1e9}];debris=[];parts=[];floats=[];rings=[];cam=0;camT=0;score=0;combo=0;perfects=0;maxCombo=0;speed=SPEED0*.62;shake=0;flash=0;skyF=0;
  run={blocks:0,perf:0,chest:0,gems:0,powers:0,chests:0,vid:{},taps:[],errs:[],play:0};P={slow:0,magnet:0,x2:0,calm:0};nextPower=6+(Math.random()*4|0);
  videoUsed=false;gemRevives=0;renderPw();spawn();
}
function spawn(){

  if(state==='play'&&score>=nextPower){const keys=RANDOM_POWERS;moving.pw=keys[Math.random()*keys.length|0];nextPower=score+8+(Math.random()*6|0);tip('bonus',t('tipBonus'),'mid')}

}
function yOf(i){return H-190-i*BH+cam}
function addFloat(x,y,txt,col,size=18){const near=floats.filter(f=>f.l>.75&&Math.abs(f.y-y)<22).length;floats.push({x,y:y-near*24,txt,col,l:1,size})}
function renderPw(){$('pw').innerHTML=Object.entries(P).filter(([,v])=>v>0).map(([k,v])=>`<span class="chip" style="background:${POWERS[k].col}">${t('p_'+k)} ${v}</span>`).join('')}

function drop(){
  if(state!=='play'||!moving)return;
  $('hint').hidden=true;
  const top=stack[stack.length-1],m=moving;
  if(run.errs&&run.errs.length<3000)run.errs.push({e:Math.abs(m.x-top.x),tol:perfTol(),mag:P.magnet>0});
  // ímã: puxa o bloco para cima da torre (vale até se fosse errar)
  if(P.magnet>0&&Math.abs(m.x-top.x)>=perfTol()){P.magnet--;m.x=top.x;addFloat(top.x+top.w/2,yOf(m.i)-24,t('magnetUse'),'#ff5d8f',14)}
  const left=Math.max(m.x,top.x),right=Math.min(m.x+m.w,top.x+top.w),ov=right-left;
  if(ov<=0){debris.push({x:m.x,w:m.w,y:yOf(m.i),vy:0,vx:m.dir*1.5,r:0,vr:m.dir*.05,i:m.i});moving=null;sfx.fall();buzz([60,40,120]);shake=14;lose();return}
  let nx=left,nw=ov,gain=1;
  const perfect=Math.abs(m.x-top.x)<perfTol();
  if(perfect){
    nx=top.x;nw=top.w;combo++;perfects++;maxCombo=Math.max(maxCombo,combo);gain=3+Math.min(5,Math.max(0,combo-2));
    if(combo>=3){const g=Math.min(12,nw*.08);const nw2=Math.min(W*BASEW,nw+g);if(nw2>nw+.5)m.grew=true;nx=clamp(top.x-(nw2-nw)/2,0,W-nw2);nw=nw2}
    sfx.perfect(combo);buzz(15);flash=1;burst(nx+nw/2,yOf(m.i)+BH/2,hue0+m.i*9,18);rings.push({x:nx,y:yOf(m.i),w:nw,t0:tNow,i:m.i});
    setCombo(combo>1?t('combo',combo):t('perfect'));
  }else{
    combo=0;setCombo('');
    const cx=m.x<top.x?m.x:right,cw=m.w-ov;
    debris.push({x:cx,w:cw,y:yOf(m.i),vy:0,vx:(m.x<top.x?-1:1)*1.2,r:0,vr:(m.x<top.x?-1:1)*.04,i:m.i});
    sfx.place(score);sfx.chop();buzz(8);
  }
  if(P.x2>0){gain*=2;P.x2--}
  if(P.slow>0)P.slow--;
  if(P.calm>0)P.calm--;
  if(perfect)run.perf+=gain;else run.blocks+=gain;
  if(m.pw){
    const pw=POWERS[m.pw];run.powers++;
    if(m.pw==='wide'){const c=nx+nw/2;nw=W*BASEW;nx=clamp(c-nw/2,0,W-nw)}else P[m.pw]=pw.n;
    addFloat(nx+nw/2,yOf(m.i)-30,t('bonusGot',t('p_'+m.pw)),pw.col,21);burst(nx+nw/2,yOf(m.i)+BH/2,0,24,pw.col);sfx.power();
  }
  addFloat(nx+nw/2,yOf(m.i)-6,'+'+gain,gain>1?'#ffc23d':'#fff7e8');
  stack.push({x:nx,w:nw,i:m.i,t0:tNow});landT=tNow;
  if(m.grew){addFloat(nx+nw/2,yOf(m.i)-54,t('grew'),'#4fe39a',17);rings.push({x:nx,y:yOf(m.i),w:nw,t0:tNow+90,i:m.i});tip('grow',t('tipGrow'),'mid')}
  score++;setScore();
  const wd=worldOf(score);
  speed=Math.min(wd>=3?SPEED_MAX_SPACE:SPEED_MAX,SPEED0+score*SPEED_STEP)*(.62+.38*ease());
  if(score%25===0){const cg=20+Math.floor(score/25)*10;run.chest+=cg;run.chests++;let s=t('chest',cg);if(Math.random()<.4){run.gems+=2;s+=t('chestGems')}addFloat(W/2,yOf(m.i)-50,s,'#ffc23d',20);burst(W/2,yOf(m.i),0,40,'#ffc23d');sfx.fanfare()}
  if([25,50,100].includes(score))setTimeout(()=>tip('stab'+wd,t('tipStab'+Math.min(wd,3)),'bar'),2600);
  if(WORLDS.some(w=>w.at===score&&score>0)){setTimeout(()=>{banner(t('world',wd+1),t('w'+wd));sfx.whoosh()},250);toast(t('ev'+wd))}
  if(yOf(stack.length)<H*.42)camT+=BH;
  renderPw();renderAbar();spawn();
}
function burst(x,y,h,n,col){for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,s=2+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,col:col||hsl(h,90,75)})}}

/* ================= DAILY + MISSIONS ================= */
const dstr=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const today=()=>dstr(new Date());const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
const DAILY=[{c:50},{c:75},{c:100},{g:3},{c:200},{c:250},{g:10}];
const MPOOL=[{t:'perf',v:[5,8,12]},{t:'floors',v:[20,30,45]},{t:'games',v:[3,5,8]},{t:'coins',v:[100,200,350]},{t:'power',v:[2,4,6]},{t:'combo',v:[3,5,7]},{t:'chest',v:[1,2,3]}];
function ensureMissions(){
  if(S.mday===today()&&S.missions.length)return;
  if(S.missions.length&&!clockOk())return;
  let seed=[...today()].reduce((a,ch)=>a*31+ch.charCodeAt(0),7)%100000;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const pool=MPOOL.slice();S.missions=[];
  for(let k=0;k<3;k++){const p=pool.splice(rnd()*pool.length|0,1)[0];const vi=rnd()*3|0;const rw=rnd()<.3?{g:2+vi*2}:{c:60+vi*45};S.missions.push({t:p.t,n:p.v[vi],prog:0,claimed:false,rw})}
  S.mday=today();save();
}
const mtxt=m=>t('m_'+m.t,m.n);
const rwHTML=r=>r.g?`<i class="gem"></i>${r.g}`:`<i class="coin"></i>&nbsp;${r.c}`;
// relógio: se a data do celular voltar (ou estiver muito diferente da hora do Google), o prêmio diário trava
let srvSkew=0;
const clockOk=()=>Date.now()>=(S.clk||0)-2*3600e3&&Math.abs(srvSkew)<3*3600e3;
const dailyReady=()=>S.daily.last!==today()&&clockOk();
const nextStreak=()=>S.daily.last===yesterday()?S.daily.streak%7+1:1;
function anyClaim(){ensureMissions();return dailyReady()||S.missions.some(m=>m.prog>=m.n&&!m.claimed)}

/* ================= ANTI-TRAPAÇA ================= */
// Cada partida guarda um resumo dos toques. No fim, se o padrão for de robô, macro ou jogo alterado,
// a partida vale normalmente pra você (moedas, recorde), mas NÃO entra no ranking mundial.
function runVerdict(sc){
  const r=run||{},why=[];
  if(S.tamper)why.push('save');
  const taps=r.taps||[],errs=(r.errs||[]).filter(e=>!e.mag);
  if(taps.some(tp=>!tp.tr))why.push('synthetic');               // toque falso gerado por script
  if(sc>=30&&r.play<sc*120)why.push('fast');                    // andares demais pro tempo jogado
  if(stack.length-1!==sc)why.push('state');                      // placar não bate com a torre
  if(taps.length>=25){
    const cnt={};let mx=0;taps.forEach(tp=>{const k=tp.x+','+tp.y;cnt[k]=(cnt[k]||0)+1;if(cnt[k]>mx)mx=cnt[k]});
    if(mx/taps.length>.8)why.push('samepx');                      // sempre no mesmo pixel = autoclick
    const iv=[];for(let k=1;k<taps.length;k++)iv.push(taps[k].t-taps[k-1].t);
    const mean=iv.reduce((a,b)=>a+b,0)/iv.length,sd=Math.sqrt(iv.reduce((a,b)=>a+(b-mean)**2,0)/iv.length);
    if(mean>0&&sd/mean<.03)why.push('rhythm');                   // ritmo perfeito de máquina
  }
  if(errs.length>=120&&errs.filter(e=>e.e>=e.tol).length<=1)why.push('perfect'); // 120 perfeitos quase sem erro
  return why;
}

  const ph=Math.sin(tNow*WAVE_W),cyc=(tNow*WAVE_W/(Math.PI*2))%1,cy=y+BH/2,amp=waveAmp(wd);
  ctx.save();
  for(let k=0;k<3;k++){const r=(cyc+k/3)%1;const a=(1-r)*(.35+.35*Math.max(0,ph));
    ctx.strokeStyle=ph>0?`rgba(120,230,255,${a})`:`rgba(190,150,255,${a*.7})`;ctx.lineWidth=2+3*(1-r);
    ctx.beginPath();ctx.ellipse(W/2,cy,20+r*W*.75,6+r*46,0,0,Math.PI*2);ctx.stroke()}
  if(moving&&ph>.25){const n=4,dir=moving.dir;ctx.strokeStyle=`rgba(160,240,255,${(ph-.25)*.8})`;ctx.lineWidth=2;
    for(let k=0;k<n;k++){const yy=y+6+k*(BH-12)/(n-1),x0=dir>0?moving.x:moving.x+moving.w,len=18+ph*amp*120;ctx.beginPath();ctx.moveTo(x0-dir*4,yy);ctx.lineTo(x0-dir*(4+len),yy);ctx.stroke()}}
  ctx.restore();
}

/* ================= LOOP ================= */
function frame(tt){
  requestAnimationFrame(frame);tNow=tt||0;
  const dt=Math.min(3,Math.max(.2,(tNow-lastT)/16.667||1));lastT=tNow;const scale=W/360;
  cam+=(camT-cam)*Math.min(1,.12*dt);skyF+=(score-skyF)*.03;
  const wd=worldOf(score);
  if(state==='play'&&run)run.play+=dt*16.667;
  if(state==='play'&&moving){
    let sp=speed*(P.slow>0?.55:1);
    if(P.calm<=0){if(wd===1)sp*=1+.55*Math.sin(tNow*.0028);if(wd===2)sp*=moving.v;if(wd>=3)sp*=1+waveAmp(wd)*Math.sin(tNow*WAVE_W)}
    moving.x+=moving.dir*sp*dt*scale;
    if(moving.x>W-moving.w*.2&&moving.dir>0)moving.dir=-1;if(moving.x<-moving.w*.8&&moving.dir<0)moving.dir=1;
  }
  if(state==='menu'&&moving){moving.x+=moving.dir*2*dt*scale;if(moving.x>W-moving.w)moving.dir=-1;if(moving.x<0)moving.dir=1}
  drawWorld();
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.3)shake=0}
  // torre balança de leve quando um bloco cai
  const la=tNow-landT,bounce=la<500?3.5*Math.exp(-la/110)*Math.sin(la/28):0;
  const first=Math.max(0,stack.length-Math.ceil(H/BH)-2);
  const top=stack[stack.length-1];
  for(let k=first;k<stack.length;k++){const b=stack[k];const y=yOf(b.i)+bounce*(k/stack.length);const age=tNow-b.t0;
    if(age<260){const sq=1-.2*Math.sin(age/260*Math.PI)*(1-age/260);ctx.save();ctx.translate(b.x+b.w/2,y+BH);ctx.scale(1+(1-sq)*.6,sq);ctx.translate(-(b.x+b.w/2),-(y+BH));block(b.x,y,b.w,b.i);ctx.restore()}
    else block(b.x,y,b.w,b.i)}
  if(moving&&(state==='play'||state==='menu'||state==='pause'||state==='ad')){
    const y=yOf(moving.i);
    // sombra do bloco sobre a torre
    if(top){const l=Math.max(moving.x,top.x),r=Math.min(moving.x+moving.w,top.x+top.w);if(r>l){ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(l,yOf(top.i),r-l,4)}}
    block(moving.x,y,moving.w,moving.i);
    if(moving.pw){const pw=POWERS[moving.pw];const p=.5+.5*Math.sin(tNow*.01);ctx.save();ctx.strokeStyle=pw.col;ctx.globalAlpha=.6+.4*p;ctx.lineWidth=3;rr(ctx,moving.x-2,y-2,moving.w+4,BH+4,7);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=pw.col;const lb='★ '+t('p_'+moving.pw);for(let k=0;k<4;k++){const a=tNow*.004+k*Math.PI/2,sx=moving.x+moving.w/2+Math.cos(a)*(moving.w/2+8),sy=y+BH/2+Math.sin(a)*(BH/2+8),r=2.5+1.5*Math.sin(tNow*.01+k);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(sx,sy-r*2);ctx.lineTo(sx+r*.6,sy);ctx.lineTo(sx,sy+r*2);ctx.lineTo(sx-r*.6,sy);ctx.fill()}ctx.fillStyle=pw.col;ctx.font='900 13px Nunito, sans-serif';const tw=Math.max(60,ctx.measureText(lb).width+20);rr(ctx,moving.x+moving.w/2-tw/2,y+7,tw,20,10);ctx.fill();ctx.fillStyle='#1a1030';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lb,moving.x+moving.w/2,y+17.5);ctx.restore()}
    if(wd>=3&&state==='play'&&P.calm<=0)drawWaves(y,wd);
    if(wd===1&&state==='play'&&P.calm<=0){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;for(let k=0;k<5;k++){const lx=((tNow*.4*windDir+k*137)%(W+120)+W+120)%(W+120)-60,ly=y-60+k*28;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+40,ly);ctx.stroke()}}
  }
  // anéis do perfeito
  for(let k=rings.length-1;k>=0;k--){const r=rings[k],a=tNow-r.t0;if(a>450){rings.splice(k,1);continue}const e=a*.09;ctx.save();ctx.globalAlpha=1-a/450;ctx.strokeStyle='#fff';ctx.lineWidth=3*(1-a/450)+1;rr(ctx,r.x-e,yOf(r.i)-e*.6,r.w+e*2,BH+e*1.2,8);ctx.stroke();ctx.restore()}
  for(let k=debris.length-1;k>=0;k--){const d=debris[k];d.vy+=.5*dt;d.y+=d.vy*dt;d.x+=d.vx*dt;d.r+=d.vr*dt;ctx.save();ctx.translate(d.x+d.w/2,d.y+BH/2);ctx.rotate(d.r);block(-d.w/2,-BH/2,d.w,d.i,.9);ctx.restore();if(d.y>H+200)debris.splice(k,1)}
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.vy+=.15*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=.025*dt;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.col;const s=6*p.l+2;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);if(p.l<=0)parts.splice(k,1)}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  for(let k=floats.length-1;k>=0;k--){const f=floats[k];f.y-=1.1*dt;f.l-=.018*dt;ctx.globalAlpha=Math.max(0,f.l);const sc=f.l>.85?1+(f.l-.85)*2:1;ctx.font=`900 ${f.size*sc}px Nunito, sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);if(f.l<=0)floats.splice(k,1)}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.1})`;ctx.fillRect(0,0,W,H);flash-=.08*dt}
  if(!$('shop').hidden)drawPreviews();
}

    if(!$('over').hidden){showMenu();return}
    if(state==='play'){pauseGame();return}
    if(state==='pause'){resumeGame();return}
    if(state==='menu'){N.exitApp();return}
  });
}
})();
</script>
</body>
</html>
