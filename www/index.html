<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1024">
<title>Big Stack</title>
<style>
  @font-face{font-family:"Bungee";src:url(fonts/bungee.woff2) format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Nunito";src:url(fonts/nunito-600.woff2) format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Nunito";src:url(fonts/nunito-800.woff2) format("woff2");font-weight:800;font-display:swap}
  @font-face{font-family:"Nunito";src:url(fonts/nunito-900.woff2) format("woff2");font-weight:900;font-display:swap}
  *{box-sizing:border-box}
  :root{color-scheme:dark;--bg:#0f1024;--card:#1c1b3a;--card2:#2a2852;--line:rgba(255,255,255,.1);--ink:#fff7e8;--muted:#b3b0d4;--sun:#ffc23d;--sunD:#c98a00;--pink:#ff5d8f;--pinkD:#b3285a;--gem:#5ee0ff;--gemD:#1d9bc0;--ok:#4fe39a;--okD:#1f9c62;--vio:#8b7bff;--vioD:#3a2699;
    --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{font-family:"Nunito",system-ui,sans-serif}
  #wrap{position:absolute;top:var(--sat);bottom:var(--sab);left:0;right:0;max-width:520px;margin:0 auto;overflow:hidden}
  canvas#c{display:block;width:100%;height:100%}
  .coin{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2a8,var(--sun) 45%,var(--sunD));box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);vertical-align:-.1em;flex:none}
  .gem{display:inline-block;width:.72em;height:.72em;transform:rotate(45deg);background:linear-gradient(135deg,#d9f8ff,var(--gem) 50%,var(--gemD));border-radius:2px;vertical-align:-.02em;margin-inline:.12em;flex:none}
  .wallet{position:absolute;top:14px;left:14px;display:flex;gap:8px;z-index:6;pointer-events:none}
  .pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);border-radius:999px;padding:6px 12px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;transition:transform .15s}
  .pill.bump{transform:scale(1.15)}
  .icon-btn{position:absolute;top:10px;right:12px;z-index:7;width:42px;height:42px;border-radius:14px;border:0;background:rgba(0,0,0,.4);color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn svg{width:22px;height:22px}
  .hud{position:absolute;top:56px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
  #score{font-family:"Bungee",Impact,sans-serif;font-size:64px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35)}
  #score.pop{animation:spop .25s ease-out}
  @keyframes spop{0%{transform:scale(1.28)}100%{transform:scale(1)}}
  #combo{font-family:"Bungee",Impact,sans-serif;font-size:18px;color:var(--sun);min-height:22px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  #combo.pop{animation:cpop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes cpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  #pw{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-inline:16px}
  .chip{font:900 12px "Nunito",sans-serif;letter-spacing:.06em;padding:4px 9px;border-radius:999px;color:#1a1030;animation:cpop .4s}
  #hint{position:absolute;left:0;right:0;bottom:30%;text-align:center;font-weight:900;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85);pointer-events:none;animation:blink 1.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  #banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-family:"Bungee",Impact,sans-serif;text-shadow:0 4px 0 rgba(0,0,0,.35);animation:ban 2.4s ease forwards}
  #banner small{display:block;font-size:14px;letter-spacing:.2em;color:var(--sun)}
  #banner span{font-size:40px}
  @keyframes ban{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.05)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
  /* barra de habilidades */
  #abar{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:16px;z-index:5;pointer-events:none;animation:pin .4s cubic-bezier(.2,1.3,.4,1)}
  .ab{pointer-events:auto;position:relative;width:60px;height:60px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.35);transition:transform .1s;touch-action:manipulation}
  .ab:active{transform:scale(.88)}
  .ab svg{width:30px;height:30px;pointer-events:none}
  .ab .bd{position:absolute;top:-5px;right:-5px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font:900 13px "Nunito",sans-serif;color:#fff;background:#e53950;border:2px solid #fff;padding:0 5px;pointer-events:none}
  .ab .bd.plus{background:#2fbf5b;font-size:19px;line-height:1}
  .ab .lbl{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font:900 10px "Nunito",sans-serif;letter-spacing:.05em;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;pointer-events:none}
  .ab::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:6px solid rgba(255,255,255,.35);opacity:0;pointer-events:none}
  .ab.on::after{animation:abpulse .7s ease-in-out infinite alternate;will-change:opacity}
  .ab.spent{filter:grayscale(.85) brightness(.75)}
  .ab.idle{filter:grayscale(.7) brightness(.7);opacity:.7}
  .ab .bd.spent{background:#5b5670;font-size:12px}
  .ab.nope{animation:abnope .35s}
  @keyframes abnope{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  @keyframes abpulse{to{opacity:1}}
  .a-magnet{background:linear-gradient(160deg,#ff7a9c,#e0305a)}.a-slow{background:linear-gradient(160deg,#6fd0ff,#2a86d8)}.a-wide{background:linear-gradient(160deg,#6ff0a8,#1fa864)}.a-calm{background:linear-gradient(160deg,#c7b3ff,#7a5ae0)}
  .pwr{flex-direction:row!important;align-items:center!important;text-align:left;gap:12px!important}
  .pwr .ico{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35)}
  .pwr .ico svg{width:26px;height:26px}
  .pwr .inf{flex:1;display:flex;flex-direction:column;gap:3px}
  .pwr .ds{font-size:12px;color:var(--muted);font-weight:800}
  .pwr .own{font-size:12px;color:var(--sun);font-weight:900}
  .pwr .bts{display:flex;flex-direction:column;gap:8px}
  #grid.list{grid-template-columns:1fr}
  /* panels */
  .panel{-webkit-mask-image:linear-gradient(180deg,transparent 0,transparent 54px,#000 66px);mask-image:linear-gradient(180deg,transparent 0,transparent 54px,#000 66px);position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:64px 18px 24px;text-align:center;background:linear-gradient(180deg,rgba(15,16,36,.15) 0%,rgba(15,16,36,.82) 38%,rgba(15,16,36,.95) 100%);animation:pfade .25s ease-out}
  .inner{margin-block:auto;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;animation:pin .4s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pfade{from{opacity:0}}
  @keyframes pin{from{opacity:0;transform:translateY(18px) scale(.96)}}
  .panel h2{font-family:"Bungee",Impact,sans-serif;font-size:28px;margin:0}
  .panel p{margin:0;color:var(--muted);font-size:15px;max-width:32ch}
  .big-title{font-family:"Bungee",Impact,sans-serif;font-size:clamp(44px,14vw,68px);margin:0;line-height:.95;color:var(--sun);text-shadow:0 5px 0 var(--pink)}
  /* logo tiles */
  .logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0}
  .logo .ln{display:flex;gap:6px}
  .logo i{font-style:normal;font-family:"Bungee",Impact,sans-serif;font-size:clamp(30px,10.5vw,50px);width:1.22em;height:1.22em;display:grid;place-items:center;border-radius:.22em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);box-shadow:inset 0 .12em 0 rgba(255,255,255,.35),inset 0 -.14em 0 rgba(0,0,0,.25),0 .12em 0 rgba(0,0,0,.35);animation:tdrop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*70ms)}
  .logo.idle i{animation:tbob 3s ease-in-out infinite;animation-delay:calc(var(--i)*120ms)}
  @keyframes tdrop{0%{transform:translateY(-120px) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:none}}
  @keyframes tbob{50%{transform:translateY(-4px)}}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{position:relative;font-family:"Bungee",Impact,sans-serif;font-size:20px;color:#1a1030;background:var(--sun);border:0;border-radius:14px;padding:13px 26px;box-shadow:0 5px 0 var(--sunD);cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sunD)}
  .btn:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible,.sw:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .btn.play{font-size:26px;padding:16px 48px;animation:breathe 2.2s ease-in-out infinite}
  #over .btn.play{white-space:nowrap;padding:14px 34px}
  @media (max-height:720px){#over .big-title{font-size:40px}#over .stats b{font-size:26px}#over .earn{padding:10px 14px;gap:3px;font-size:14px}#over .btn.play{font-size:22px;padding:12px 28px}#over .up{padding:8px 12px;font-size:13px}#over .inner{gap:9px}
    #menu .inner{gap:10px}#menu .logo i{font-size:clamp(26px,9vw,42px)}}
  @keyframes breathe{50%{transform:scale(1.05)}}
  .btn.alt{background:var(--card2);color:var(--ink);box-shadow:0 5px 0 #0b0a1f}
  .btn.gemb{background:var(--gem);box-shadow:0 5px 0 var(--gemD)}
  .btn.pinkb{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pinkD)}
  .btn.okb{background:var(--ok);box-shadow:0 5px 0 var(--okD)}
  .btn.sm{font-size:15px;padding:10px 16px;border-radius:12px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn svg{width:18px;height:18px}
  .dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:2px solid var(--bg);animation:blink 1.4s infinite}
  .link{background:none;border:0;color:var(--muted);font:800 15px "Nunito",sans-serif;text-decoration:underline;cursor:pointer;padding:8px}
  .lvl{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;width:min(100%,320px)}
  .badge{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,var(--vio),#5a3fd6);font-family:"Bungee",Impact,sans-serif;font-size:20px;box-shadow:0 3px 0 var(--vioD)}
  .lvl .info{flex:1;display:flex;flex-direction:column;gap:5px;text-align:left}
  .lvl .t{display:flex;justify-content:space-between;font-weight:900;font-size:14px}
  .lvl .t span{color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--vio),#c19bff);transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .bar.g i{background:linear-gradient(90deg,var(--ok),#a8ffcf)}
  .ring{position:relative;width:110px;height:110px}
  .ring svg{transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bungee",Impact,sans-serif;font-size:40px}
  .earn{background:var(--card);border-radius:16px;padding:14px 18px;width:min(100%,320px);display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
  .earn div{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--muted);animation:pin .35s both}
  .earn div b{color:var(--ink);display:flex;align-items:center;gap:4px}
  .earn .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-size:18px;color:var(--ink)}
  .earn .x2,.earn .x2 b{color:var(--pink)}
  .stats{display:flex;gap:28px;font-variant-numeric:tabular-nums}
  .stats div{display:flex;flex-direction:column}
  .stats b{font-family:"Bungee",Impact,sans-serif;font-size:32px}
  .stats span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .hot{font-family:"Bungee",Impact,sans-serif;color:var(--pink);font-size:17px;animation:pop .6s ease-in-out infinite alternate}
  .up{background:linear-gradient(160deg,var(--vio),#5a3fd6);border-radius:14px;padding:10px 16px;font-weight:900;width:min(100%,320px);animation:pin .5s .3s both}
  @keyframes pop{to{transform:scale(1.08)}}
  .top{display:flex;width:100%;justify-content:space-between;align-items:center}
  .tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
  .tab{background:none;border:0;color:var(--muted);font:900 15px "Nunito",sans-serif;padding:9px 18px;border-radius:10px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--card2);color:var(--ink)}
  .full{background:rgba(15,16,36,.97);justify-content:flex-start}
  .full .inner{margin-block:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%}
  .item{background:var(--card);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch;border:2px solid transparent;animation:pin .35s both}
  .item.on{border-color:var(--ok)}
  .item canvas{width:100%;height:84px;border-radius:10px;background:#15142f}
  .item .nm{font-weight:900;font-size:15px}
  .item .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:-6px}
  .item .btn{font-size:14px;padding:9px 8px;border-radius:10px}
  .item .btn.used{background:var(--ok);box-shadow:0 4px 0 var(--okD)}
  .pack .big{font-family:"Bungee",Impact,sans-serif;font-size:28px;padding-block:16px;display:flex;justify-content:center;align-items:center;gap:4px}
  .pack .best{font-size:11px;font-weight:900;letter-spacing:.1em;color:#fff;background:var(--pink);border-radius:6px;padding:2px 6px;align-self:center}
  .note{font-size:12px!important;color:var(--muted);max-width:40ch;margin-inline:auto!important}
  .btn.dlyb{background:linear-gradient(160deg,#39d0e6,#2a7fd6);color:#fff;box-shadow:0 5px 0 #1d5a9e;width:min(100%,320px);gap:8px}
  .btn.dlyb svg{width:22px;height:22px;flex:none}.btn.dlyb small{font:900 12px "Nunito",sans-serif;background:rgba(0,0,0,.25);border-radius:99px;padding:2px 8px;letter-spacing:.02em}
  .btn.dlyb.done{filter:saturate(.5) brightness(.85)}
  .btn.share{background:linear-gradient(160deg,#4fe39a,#27b877);color:#08301d;box-shadow:0 5px 0 #1a8a55}.btn.share svg{width:18px;height:18px}
  #dlyTag{font:900 12px "Nunito",sans-serif;letter-spacing:.14em;color:#7fe7ff;background:rgba(0,0,0,.35);border-radius:99px;padding:3px 12px;margin:0 auto 4px;width:max-content}
  .tier{vertical-align:-3px;flex:none}
  .rrow .tier{margin-right:6px}
  .ppcard{width:100%;background:linear-gradient(160deg,#2a2356,#1b1640);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08)}
  .ppcard .fl{font-size:44px;line-height:1}.ppcard .nm{font-family:"Bungee",Impact,sans-serif;font-size:21px;word-break:break-all}
  .ppcard .tr{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px;margin-top:4px}.ppcard .lv{font-size:13px;color:var(--muted);font-weight:800;margin-top:2px}
  .ppgrid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ppgrid div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;text-align:left}.ppgrid b{display:block;font-family:"Bungee",Impact,sans-serif;font-size:22px}.ppgrid span{font-size:12px;font-weight:800;color:var(--muted)}
  .ppmed{width:100%;display:flex;flex-wrap:wrap;gap:8px}.ppmed .md{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border-radius:99px;padding:6px 12px 6px 6px;font-weight:900;font-size:13px}
  .ppmed .md i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:"Bungee",Impact,sans-serif;font-size:13px;color:#1a1030}
  .ppmed .none{color:var(--muted);font-size:13px;font-weight:700;text-align:left}
  .ppach{width:100%;display:grid;grid-template-columns:1fr;gap:8px}
  .ach{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 12px;text-align:left}
  .ach img{width:46px;height:46px;border-radius:12px;flex:none}.ach.lock img{filter:grayscale(1) brightness(.55)}.ach.lock{opacity:.8}
  .ach b{display:block;font-size:14px}.ach span{font-size:12px;color:var(--muted);font-weight:700}.ach .bar{margin-top:5px;height:6px}
  .ovtic{font-size:56px;animation:pop .7s ease-in-out infinite alternate}
  .ovtlist{display:flex;flex-direction:column;gap:6px;width:min(100%,320px)}.ovtlist div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px;font-weight:900;display:flex;gap:8px;align-items:center}
  .ovtlist b{margin-left:auto;font-family:"Bungee",Impact,sans-serif}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,320px)}.mgrid .btn{width:100%}
  .cats{display:flex;gap:8px;overflow-x:auto;width:100%;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.cats::-webkit-scrollbar{display:none}
  .cats button{flex:none;border:0;border-radius:999px;background:var(--card);color:var(--ink);font:900 13px "Nunito",sans-serif;padding:8px 12px;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.06)}
  .cats button.on{background:linear-gradient(160deg,var(--vio),#5a3fd6);box-shadow:0 3px 0 var(--vioD)}.cats button small{font-size:11px;opacity:.75;background:rgba(0,0,0,.25);border-radius:99px;padding:1px 6px}
  .cats button.full small{background:var(--ok);color:#06301c;opacity:1}
  .chead{width:100%;display:flex;align-items:center;gap:10px;font-weight:900;font-size:14px;text-align:left}.chead .bar{flex:1;height:8px}.chead span{color:var(--muted);font-size:12px}
  .item .tag.season{color:#ffc23d}.item .tag.snd{color:#7fe3ff}.item.off canvas{filter:saturate(.35) brightness(.7)}
  .collhero{width:100%;display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,#2a2356,#1b1640);border-radius:18px;padding:10px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08)}
  .collhero canvas{width:52%;height:120px;border-radius:12px;background:#15142f;flex:none}.collhero .ci{display:flex;flex-direction:column;gap:4px;text-align:left}.collhero b{font-family:"Bungee",Impact,sans-serif;font-size:18px}.collhero span{color:var(--muted);font-weight:800;font-size:13px}
  .collprog{width:100%;display:flex;align-items:center;gap:10px;font-weight:900}.collprog .bar{flex:1;height:10px}
  .colllist{width:100%;display:flex;flex-direction:column;gap:14px}.csec{display:flex;flex-direction:column;gap:8px}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .citem{background:var(--card);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;border:2px solid transparent;cursor:pointer;font:900 12px "Nunito",sans-serif;color:var(--ink);text-align:center}

  .item.deal{border-color:var(--pink)}

  .pwpack{grid-column:1/-1;flex-direction:row!important;align-items:center!important;gap:12px!important;text-align:left}

  .pwpack .inf{flex:1}.pwpack .nm{font-weight:900}.pwpack .ds{font-size:12px;color:var(--muted);font-weight:800}
  /* fim de partida: precisão */

  .acc{width:100%;background:var(--card);border-radius:16px;padding:12px 14px;text-align:left}
  .acc .ah{display:flex;justify-content:space-between;font-weight:900;font-size:13px}.acc .ah span{color:var(--ok)}
  .abars{display:flex;align-items:flex-end;gap:2px;height:42px;margin:8px 0 6px}.abars i{flex:1;border-radius:2px 2px 0 0;background:#ff9a3d}.abars i.p{background:var(--ok)}.abars i.b{background:var(--pink)}
  .acc p{margin:0;font-size:12.5px;color:var(--muted);font-weight:800}
  /* contra o tempo, chefão */
  #tmr{font:22px "Bungee",Impact,sans-serif;color:#fff;background:rgba(0,0,0,.35);border-radius:14px;padding:2px 14px;margin:2px auto 4px;width:max-content}#tmr.low{color:#ff5d8f;animation:pop .5s ease-in-out infinite alternate}
  .chip.boss{background:#ff4d6d;color:#fff}
  /* acessibilidade */
  body.bigtxt .panel{font-size:17px}body.bigtxt .note,body.bigtxt .ec small,body.bigtxt .mrow small,body.bigtxt .goal small{font-size:14px}body.bigtxt #nav button{font-size:12px}
  body.cblind{--ok:#4aa8ff;--okD:#1d6fc0;--pink:#ff9f1c;--pinkD:#c26a00}
  body.rmotion *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

const A={ctx:null,master:null,music:null,sfx:null,rev:null,noise:null,musicOn:false};
function audioInit(){
  if(A.ctx)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;const ac=new C();A.ctx=ac;
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
    A.master=ac.createGain();A.master.gain.value=.9;A.master.connect(comp);
    A.music=ac.createGain();A.sfx=ac.createGain();A.music.connect(A.master);A.sfx.connect(A.master);
    // reverb com impulso gerado
    const len=ac.sampleRate*2.2,ir=ac.createBuffer(2,len,ac.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
    A.rev=ac.createConvolver();A.rev.buffer=ir;const rg=ac.createGain();rg.gain.value=.32;A.rev.connect(rg);rg.connect(A.master);
    const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;A.noise=nb;
    applyVolumes();
  }catch(e){A.ctx=null}
}
function applyVolumes(){if(!A.ctx)return;const s=S.settings,n=A.ctx.currentTime;A.music.gain.setTargetAtTime(s.music?s.musicVol/100*.55:0,n,.1);A.sfx.gain.setTargetAtTime(s.sfx?s.sfxVol/100:0,n,.05);if(s.music)musicStart();}
const now=()=>A.ctx.currentTime;
function env(g,t0,a,peak,d){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d)}
function osc(type,f,t0,dur,peak,dest,{a=.005,glide=0,rev=0}={}){const ac=A.ctx,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(glide)o.frequency.exponentialRampToValueAtTime(glide,t0+dur);env(g,t0,a,peak,dur);o.connect(g);g.connect(dest);if(rev){const s=ac.createGain();s.gain.value=rev;g.connect(s);s.connect(A.rev)}o.start(t0);o.stop(t0+a+dur+.05);return o}
function noise(t0,dur,peak,dest,type='bandpass',f=1800,q=1,f2){const ac=A.ctx,s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=A.noise;fl.type=type;fl.frequency.setValueAtTime(f,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+dur);fl.Q.value=q;env(g,t0,.003,peak,dur);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t0);s.stop(t0+dur+.05)}
function bell(f,t0,peak=.22,dur=1.1,rev=.5){osc('sine',f,t0,dur,peak,A.sfx,{a:.004,rev});osc('sine',f*2,t0,dur*.6,peak*.35,A.sfx,{a:.004,rev});osc('triangle',f*3.01,t0,dur*.25,peak*.12,A.sfx,{a:.002})}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760,2093];
// skin de som equipada (muda o som dos blocos)
const sndPack=()=>{const s=skinOf(S.skin);return s&&s.snd&&typeof SND!=='undefined'?SND[s.snd]:null};
const sfx={
  ok:()=>S.settings.sfx&&A.ctx&&A.ctx.state==='running',
  place(h){if(!sfx.ok())return;const pk=sndPack();if(pk){pk.place(h);return}const t0=now(),b=120+Math.min(h,60)*1.2;osc('sine',b*1.6,t0,.16,.5,A.sfx,{glide:b*.6});noise(t0,.05,.18,A.sfx,'bandpass',2400,1.2);osc('triangle',b*3,t0,.05,.06,A.sfx)},
  chop(){if(!sfx.ok())return;const t0=now();noise(t0,.22,.22,A.sfx,'lowpass',4200,.8,500);osc('sine',180,t0,.14,.35,A.sfx,{glide:70})},
  perfect(c){if(!sfx.ok())return;const pk=sndPack();if(pk){pk.perfect(c);return}const t0=now(),i=Math.min(c-1,PENTA.length-1);bell(PENTA[i],t0,.2);if(c>=3)bell(PENTA[Math.min(i+2,PENTA.length-1)]*1,t0+.07,.1,.8);osc('sine',150,t0,.12,.35,A.sfx,{glide:70})},
  coin(){if(!sfx.ok())return;const t0=now();bell(1568,t0,.09,.35,.2);bell(2093,t0+.07,.08,.45,.2)},
  tick(){if(!sfx.ok())return;bell(1760+Math.random()*200,now(),.035,.12,0)},
  fall(){if(!sfx.ok())return;const t0=now();osc('triangle',420,t0,.6,.22,A.sfx,{glide:70,rev:.3});noise(t0,.5,.14,A.sfx,'lowpass',1800,.7,200)},
  ui(){if(!sfx.ok())return;const t0=now();osc('sine',780,t0,.07,.18,A.sfx,{glide:420});noise(t0,.02,.06,A.sfx,'highpass',5000)},
  power(){if(!sfx.ok())return;const t0=now();[0,2,4,7].forEach((k,j)=>bell(PENTA[k],t0+j*.06,.12,.6))},
  fanfare(){if(!sfx.ok())return;const t0=now();[523.25,659.25,783.99,1046.5,1318.51].forEach((f,j)=>bell(f,t0+j*.09,.14,1.2,.6))},
  revive(){if(!sfx.ok())return;const t0=now();for(let j=0;j<6;j++)bell(PENTA[j+2],t0+j*.05,.08,.7,.6);osc('sine',220,t0,.8,.15,A.sfx,{a:.2,glide:440,rev:.4})},
  whoosh(){if(!sfx.ok())return;noise(now(),.35,.1,A.sfx,'bandpass',400,.8,3000)}
};

const M={timer:null,next:0,step:0,bpm:92};
const CH=[[130.81,164.81,196,246.94],[110,130.81,164.81,196],[87.31,110,130.81,164.81],[98,123.47,146.83,164.81]];
function musicStart(){if(!A.ctx||M.timer||!S.settings.music)return;M.next=A.ctx.currentTime+.1;M.step=0;M.timer=setInterval(musicTick,60)}
function musicStop(){clearInterval(M.timer);M.timer=null}
function musicTick(){const ac=A.ctx;if(!ac||ac.state!=='running')return;const e=60/M.bpm/2;
  while(M.next<ac.currentTime+.25){playStep(M.step,M.next,e);M.next+=e;M.step++}}
function playStep(s,t0,e){
  const bar=Math.floor(s/8)%4,b8=s%8,ch=CH[bar],dest=A.music,ac=A.ctx;
  if(b8===0){ // pad
    ch.forEach(f=>{[0,-6].forEach(det=>{const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type='triangle';o.frequency.value=f;o.detune.value=det;fl.type='lowpass';fl.frequency.value=900;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.05,t0+.6);g.gain.setValueAtTime(.05,t0+e*7);g.gain.exponentialRampToValueAtTime(.0001,t0+e*8+.4);o.connect(fl);fl.connect(g);g.connect(dest);const sg=ac.createGain();sg.gain.value=.4;g.connect(sg);sg.connect(A.rev);o.start(t0);o.stop(t0+e*8+.5)})});
  }
  if(b8===0||b8===4){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=ch[0]/2;env(g,t0,.01,.22,e*3.5);o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+e*4)}
  if(b8===2||b8===6){const s2=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s2.buffer=A.noise;f.type='highpass';f.frequency.value=6500;env(g,t0,.002,.035,.06);s2.connect(f);f.connect(g);g.connect(dest);s2.start(t0);s2.stop(t0+.1)}
  if(Math.random()<.62){const f=ch[(Math.random()*4)|0]*(Math.random()<.5?4:2);const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;env(g,t0,.005,.07,e*2.2);o.connect(g);g.connect(dest);const sg=ac.createGain();sg.gain.value=.6;g.connect(sg);sg.connect(A.rev);o.start(t0);o.stop(t0+e*2.5)}
}

const POSM=new Map(),SGN=[-1,1];function posMemo(k,x,w,mk){let v=POSM.get(k);if(!v||v.x!==x||v.w!==w){if(POSM.size>4000)POSM.clear();v={x,w,o:mk()};POSM.set(k,v)}return v.o}

let SKM=null,SKMn=0;const skinOf=id=>{if(!SKM||SKMn!==SKINS.length){SKM=new Map(SKINS.map(s=>[s.id,s]));SKMn=SKINS.length}return SKM.get(id)||SKINS[0]};
function block(x,y,w,i,alpha=1,c=ctx,sk){if(w<=.5)return;sk=sk||skinOf(S.skin);c.save();c.globalAlpha=alpha;rr(c,x,y,w,BH,sk.r??5);c.clip();sk.draw(c,x,y,w,i);c.restore()}

/* ---- desempenho: a torre mora numa "folha" (uma imagem só, uma faixa por andar, em rodízio) ----
   - Skins paradas: cada bloco é desenhado 1 vez na folha e depois só copiado.
   - Skins "divididas" (base + brilho): a base fica pronta numa 2ª folha; o brilho é redesenhado em rodízio.
   - Skins animadas: redesenhadas em rodízio (metade dos blocos por frame → animação a 30 fps, torre a 60).
   Tudo sai da mesma imagem: o celular desenha a torre inteira quase de uma vez e nenhum "canvas" novo é criado
   a cada bloco (criar canvas no meio da partida causava pequenos engasgos). Blocos fora da tela não são desenhados. ---- */
const BC={id:null,dpr:0,w:0,mode:'live'};
function skinProbe(sk){const PW=Math.max(240,Math.round(W||360));const cv=document.createElement('canvas');cv.width=PW;cv.height=BH;const c=cv.getContext('2d',{willReadFrequently:true});const t0=tNow;
  const snap=t=>{tNow=t;c.clearRect(0,0,PW,BH);block(0,0,PW,3,1,c,sk);return c.getImageData(0,0,PW,BH).data};
  // compara vários momentos (brilhos que passam de vez em quando também contam como animação), todos os canais
  let anim=false;try{const a=snap(1000);for(const t of [1777,3100,4700,6300,8200,9900]){const b=snap(t);for(let k=0;k<a.length;k++)if(a[k]!==b[k]){anim=true;break}if(anim)break}}catch(e){anim=true}
  tNow=t0;return {anim}}
function bcSync(){const sk=skinOf(S.skin);if(BC.id===sk.id&&BC.dpr===DPR&&BC.w===W)return;const pr=sk.fx?{anim:true}:skinProbe(sk);BC.id=sk.id;BC.dpr=DPR;BC.w=W;
  BC.mode=sk.fx?'split':pr.anim?'live':'cache';BC.sk=sk;TL.gen++}
// bloco que acabou de cair (efeito de amassar): desenhado na hora
function squash(b,y,age){const sq=1-.2*Math.sin(age/260*Math.PI)*(1-age/260);ctx.save();ctx.translate(b.x+b.w/2,y+BH);ctx.scale(1+(1-sq)*.6,sq);ctx.translate(-(b.x+b.w/2),-(y+BH));block(b.x,y,b.w,b.i);ctx.restore()}
const TL={cv:null,c:null,bcv:null,bc:null,sh:0,ns:0,pw:0,own:[],key:'',gen:1,f:0,N:0};
function tlEnsure(split){const sh=Math.ceil(BH*DPR)+2,ns=Math.ceil(H/BH)+4,pw=Math.ceil(W*DPR)+4,k=pw+'x'+sh*ns+'_'+DPR+'_'+TL.gen;
  if(!TL.cv){TL.cv=document.createElement('canvas');TL.c=TL.cv.getContext('2d')}
  if(split&&!TL.bcv){TL.bcv=document.createElement('canvas');TL.bc=TL.bcv.getContext('2d');TL.key=''}
  if(TL.key!==k){TL.key=k;TL.sh=sh;TL.ns=ns;TL.pw=pw;TL.own=new Array(ns);TL.cv.width=pw;TL.cv.height=sh*ns;if(TL.bcv){TL.bcv.width=pw;TL.bcv.height=sh*ns}}
  if(!split&&TL.bcv){TL.bcv.width=TL.bcv.height=1;TL.bcv=TL.bc=null}}
// desenha um bloco inteiro (ou só a base/o brilho) na faixa sy de uma folha
function tlPaint(c,sy,b,fn,sk){c.setTransform(1,0,0,1,0,0);c.clearRect(0,sy,TL.pw,TL.sh);c.setTransform(DPR,0,0,DPR,2,sy+1);c.save();rr(c,b.x,0,b.w,BH,sk.r??5);c.clip();fn.call(sk,c,b.x,0,b.w,b.i);c.restore()}
// desenha a torre visível (first..fim)
function drawStack(first,yFor){bcSync();const sk=BC.sk,mode=BC.mode,split=mode==='split',anim=mode!=='cache';tlEnsure(split);
  const c=TL.c,ns=TL.ns,sh=TL.sh,pw=TL.pw,N=TL.N||(QCAP<=1.25?3:2),f=++TL.f,n=stack.length;const shiny=isShiny(BC.id);
  // 1º passo: descobre o que precisa redesenhar (e refaz as bases das skins divididas)
  // (tudo antes de copiar: misturar desenhar e copiar obriga o navegador a duplicar a folha)
  for(let k=first;k<n;k++){const b=stack[k];const y=yFor(k,b);if(y>H+2||y<-BH-2||tNow-b.t0<260||b.w<=.5)continue;
    const s=k%ns,o=TL.own[s],stale=!o||o.b!==b||o.x!==b.x||o.w!==b.w;
    if(stale){if(o){o.b=b;o.x=b.x;o.w=b.w}else TL.own[s]={b,x:b.x,w:b.w};if(split)tlPaint(TL.bc,s*sh,b,sk.base,sk)}
    b.rf=stale||(anim&&(k+f)%N===0)?f:0}
  // 2º passo: redesenha na folha os blocos da vez
  for(let k=first;k<n;k++){const b=stack[k];if(b.rf!==f)continue;const sy=(k%ns)*sh;
    if(split){c.setTransform(1,0,0,1,0,0);c.clearRect(0,sy,pw,sh);c.drawImage(TL.bcv,0,sy,pw,sh,0,sy,pw,sh);c.setTransform(DPR,0,0,DPR,2,sy+1);c.save();rr(c,b.x,0,b.w,BH,sk.r??5);c.clip();sk.fx(c,b.x,0,b.w,b.i);c.restore()}
    else tlPaint(c,sy,b,sk.draw,sk)}
  // 3º passo: copia a torre da folha pra tela
  for(let k=first;k<n;k++){const b=stack[k];const y=yFor(k,b);if(y>H+2||y<-BH-2)continue;const age=tNow-b.t0;
    if(age<260){squash(b,y,age);continue}if(b.w<=.5)continue;
    const sy=(k%ns)*sh,sx=Math.max(0,Math.floor(b.x*DPR)),sw=Math.min(pw,Math.ceil((b.x+b.w)*DPR)+4)-sx;
    if(sw>0)ctx.drawImage(TL.cv,sx,sy,sw,sh,(sx-2)/DPR,y-1/DPR,sw/DPR,sh/DPR);if(shiny)shinyFx(b.x,y,b.w,b.i)}}

/* ---- desempenho do cenário ----
   O fundo (céu, estrelas, aurora, espaço e nuvens) é desenhado numa imagem de resolução menor e ampliada de uma vez:
   é tudo suave/desfocado, então fica igual na tela e custa ~4x menos pixels. Quando a câmera está parada, o fundo
   é redesenhado a 30 fps (o que mexe ali é lento: estrelas piscando, nuvens, planetas).
   Cidade e nuvem viram imagens prontas (feitas 1 vez); degradês são guardados e só refeitos quando a cor muda. */
const BG={cv:null,c:null,s:0,odd:false,t:0,dirty:true};
function bgEnsure(){const s=Math.max(.75,DPR*.5),pw=Math.max(1,Math.ceil(W*s)),ph=Math.max(1,Math.ceil(H*s));
  if(!BG.cv){BG.cv=document.createElement('canvas');BG.c=BG.cv.getContext('2d',{alpha:false})}
  if(BG.cv.width!==pw||BG.cv.height!==ph||BG.s!==s){BG.cv.width=pw;BG.cv.height=ph;BG.s=s;BG.dirty=true;CLOUD.cv=null}
  BG.c.setTransform(s,0,0,s,0,0)}
// cor do céu sem criar lixo na memória: só monta o texto/degradê quando a cor muda de verdade
const SKY={k:'',g:null,h:0};
function skyMix(key,o){let r=WORLDS[0][key][0],g=WORLDS[0][key][1],b=WORLDS[0][key][2];for(let k=1;k<WORLDS.length;k++){const t=clamp((skyF-(WORLDS[k].at-8))/8,0,1);if(t<=0)continue;const c=WORLDS[k][key];r+=(c[0]-r)*t;g+=(c[1]-g)*t;b+=(c[2]-b)*t}o[0]=r|0;o[1]=g|0;o[2]=b|0}
const SKT=[0,0,0],SKB=[0,0,0];
function skyGrad(c){skyMix('top',SKT);skyMix('bot',SKB);const k=((SKT[0]<<16|SKT[1]<<8|SKT[2])*16777216+(SKB[0]<<16|SKB[1]<<8|SKB[2]))+'_'+H;
  if(SKY.k!==k||!SKY.g){SKY.k=k;const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${SKT[0]},${SKT[1]},${SKT[2]})`);g.addColorStop(1,`rgb(${SKB[0]},${SKB[1]},${SKB[2]})`);SKY.g=g}return SKY.g}
// degradês da aurora guardados por faixa e intensidade (a forma da onda continua animada)
const AUG={};function auGrad(c,b,au,base){const q=Math.round(au*30),k=b+'_'+q+'_'+H;let g=AUG[k];if(g)return g;
  g=c.createLinearGradient(0,base-30,0,base+70);g.addColorStop(0,'rgba(90,255,170,0)');g.addColorStop(.4,`rgba(${b?120:80},255,${b?220:160},${(.22*q/30).toFixed(3)})`);g.addColorStop(1,'rgba(90,255,170,0)');return AUG[k]=g}
// nuvem pronta (mesma forma de antes, em imagem)
const CLOUD={cv:null};function cloudSprite(){if(CLOUD.cv)return CLOUD.cv;const U=1.4*(BG.s||1),cv=document.createElement('canvas');cv.width=Math.ceil(84*U);cv.height=Math.ceil(52*U);
  const c=cv.getContext('2d');c.scale(U,U);c.translate(20,32);c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.arc(0,0,18,0,7);c.arc(20,-8,22,0,7);c.arc(44,0,17,0,7);c.rect(0,0,44,17);c.fill();return CLOUD.cv=cv}
// cidade pronta: sol + prédios + janelas numa imagem só (nítida, na resolução da tela)
const CITY={cv:null,k:''};const CITY_H=200;
function citySprite(){const k=W+'_'+DPR+'_'+city.length;if(CITY.cv&&CITY.k===k)return CITY.cv;const d=DPR||1,cv=document.createElement('canvas');cv.width=Math.ceil(W*d);cv.height=Math.ceil(CITY_H*d);
  const c=cv.getContext('2d');c.scale(d,d);const gy=CITY_H;c.fillStyle='rgba(255,210,150,.25)';c.beginPath();c.arc(W*.72,gy-150,46,0,7);c.fill();
  for(const b of city){c.fillStyle='rgba(30,16,56,.75)';c.fillRect(b.x,gy-b.h,b.w,b.h);c.fillStyle='rgba(255,215,120,.55)';b.win.forEach((on,k)=>{if(!on)return;const cx=b.x+5+(k%3)*((b.w-10)/3),cy=gy-b.h+8+Math.floor(k/3)*16;if(cy<gy-6)c.fillRect(cx,cy,5,7)})}
  CITY.cv=cv;CITY.k=k;return cv}
// fundo (desenhado no contexto que estiver em ctx: a imagem do fundo)
function drawBG(){
  ctx.fillStyle=skyGrad(ctx);ctx.fillRect(0,0,W,H);
  const nightA=clamp((skyF-40)/15,0,1)*.9+.25*(1-clamp(skyF/20,0,1));
  if(nightA>.02)for(const s of stars){const a=nightA*(.4+.6*Math.abs(Math.sin(tNow*.001+s.p)));if(a<.02)continue;ctx.fillStyle=WA[Math.min(20,Math.round(a*20))];ctx.fillRect(s.x*W,((s.y*H+cam*.08)%H),s.s,s.s)}
  // aurora
  const au=clamp((skyF-44)/8,0,1)*(1-clamp((skyF-96)/8,0,1));
  if(au>0){for(let b=0;b<3;b++){ctx.beginPath();const base=H*(.18+b*.12);ctx.moveTo(0,base);for(let X=0;X<=W;X+=10)ctx.lineTo(X,base+Math.sin(X*.012+tNow*.0006*(b+1)+b)*26);ctx.lineTo(W,base+70);ctx.lineTo(0,base+70);ctx.fillStyle=auGrad(ctx,b,au,base);ctx.fill()}}
  drawScenery();
  // nuvens (andam pelo tempo real, não por frame: mesma velocidade em 60/90/120 Hz)
  const bdt=Math.min(4,Math.max(0,(tNow-BG.t)/16.667));BG.t=tNow;const windy=worldOf(score)===1&&state==='play',sp=cloudSprite();
  for(const cl of clouds){cl.x=(cl.x+(cl.v+(windy?windDir*.0012:0))*bdt+1)%1;const y=yOf(cl.f);if(y<-40||y>H+40)continue;const x=cl.x*(W+160)-80,s=cl.s;ctx.drawImage(sp,x-20*s,y-32*s,84*s,52*s)}
}
let BGD=false;
function drawWorld(){
  if(BGD){drawBG()}else{
  bgEnsure();BG.odd=!BG.odd;
  // câmera parada: fundo a 30 fps; câmera andando (depois de cada bloco): todo frame
  if(BG.dirty||BG.odd||Math.abs(camT-cam)>.3){const m=ctx;ctx=BG.c;try{drawBG()}finally{ctx=m}BG.dirty=false}
  ctx.drawImage(BG.cv,0,0,BG.cv.width,BG.cv.height,0,0,BG.cv.width/BG.s,BG.cv.height/BG.s);}
  // cidade
  const gy=yOf(0)+BH;
  if(gy-CITY_H<H){ctx.drawImage(citySprite(),0,gy-CITY_H,W,CITY_H);if(gy<H){ctx.fillStyle='#1a1030';ctx.fillRect(0,gy,W,H-gy)}}
}


/* ================= CENÁRIO DO ESPAÇO (acima do andar 100) =================
   Cada objeto fica "preso" a um andar e passa pela tela com parallax (p<1 = mais longe e mais devagar),
   então conforme a torre sobe, galáxias, planetas e buracos negros vão surgindo lá em cima e descendo. */
const TAU2=Math.PI*2;
const NEB=[[-.25,-.1,'255,90,200'],[.2,.05,'90,160,255'],[0,.2,'140,90,255'],[.3,-.25,'255,170,90'],[-.3,.3,'80,230,210']];
// nebulosa pronta: as 5 nuvens coloridas numa imagem só (em meia resolução: é tudo degradê suave).
// Antes eram 5 degradês gigantes por frame, cada um cobrindo a tela inteira.
let NS=null;function nebSprite(){const sc=Math.max(.35,(BG.s||1)*.5),k=W+'_'+H+'_'+sc;if(NS&&NS.k===k)return NS;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const bl=NEB.map(([dx,dy,c],k)=>{const R=W*(.45+hash(k)*.25),cx=dx*W,cy=dy*H;x0=Math.min(x0,cx-R);y0=Math.min(y0,cy-R);x1=Math.max(x1,cx+R);y1=Math.max(y1,cy+R);return {R,cx,cy,c}});
  const cv=document.createElement('canvas');cv.width=Math.ceil((x1-x0)*sc);cv.height=Math.ceil((y1-y0)*sc);const c=cv.getContext('2d');c.scale(sc,sc);c.translate(-x0,-y0);
  for(const b of bl){const g=c.createRadialGradient(b.cx,b.cy,0,b.cx,b.cy,b.R);g.addColorStop(0,`rgba(${b.c},.32)`);g.addColorStop(1,`rgba(${b.c},0)`);c.fillStyle=g;c.fillRect(b.cx-b.R,b.cy-b.R,b.R*2,b.R*2)}
  return NS={cv,k,x0,y0,w:x1-x0,h:y1-y0}}
const GAL=(()=>{const pts=[];for(let k=0;k<1100;k++){const arm=k%3,t=Math.random(),r=Math.pow(t,.8);const a=arm*TAU2/3+r*5.2+(Math.random()-.5)*.55*(1-r*.5);pts.push({r:r+(Math.random()-.5)*.04,a,s:Math.random()*1.6+.5,h:r<.25?45:Math.random()<.5?290:200,l:r<.25?85:65+Math.random()*25})}return pts})();
// galáxia pronta, guardada por tamanho (2 galáxias de tamanhos diferentes na tela não ficam refazendo a imagem todo frame)
// e na resolução do fundo (onde ela é desenhada)
const GSP=new Map();function galSprite(R){const d=BG.s||DPR||1,k=Math.round(R)*100+d;let cv0=GSP.get(k);if(cv0)return cv0;if(GSP.size>4)GSP.clear();const S2=Math.ceil((2*R+8)*d);const cv=document.createElement('canvas');cv.width=cv.height=S2;const c=cv.getContext('2d');c.scale(d,d);c.translate(R+4,R+4);
  for(const p of GAL){c.fillStyle=p.col||(p.col=hsl(p.h,90,p.l,.85));c.fillRect(Math.cos(p.a)*p.r*R,Math.sin(p.a)*p.r*R,p.s,p.s/.58)}GSP.set(k,cv);return cv}

function sceneAt(n){return SCN_MEMO[n]||(SCN_MEMO[n]=sceneAt0(n))}

  return {f,p:k==='asteroids'||k==='comet'?.85:.3+b*.35,k,x:.2+b*.6,r:k==='galaxy'?.4+b*.25:40+b*40,c1:hsl(b*360,80,70),c2:hsl(b*360+40,70,35),ring:`hsla(${a*360},90%,80%,.7)`}}

  ctx.restore();
}

function drop(){

  {const h=$('hint');if(!h.hidden)h.hidden=true}

function ensureMissions(){
  S.missions.forEach(m=>{if(m.rw&&m.rw.g)m.rw={c:60+m.rw.g*20}});
  if(S.mday===today()&&S.missions.length)return;
  if(S.missions.length&&!clockOk())return;
  let seed=[...today()].reduce((a,ch)=>a*31+ch.charCodeAt(0),7)%100000;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const pool=MPOOL.slice();S.missions=[];
  for(let k=0;k<3;k++){const p=pool.splice(rnd()*pool.length|0,1)[0];const vi=rnd()*3|0;const rw={c:60+vi*45};S.missions.push({t:p.t,n:p.v[vi],prog:0,claimed:false,rw})}
  S.mday=today();save();
}
const mtxt=m=>t('m_'+m.t,m.n);
const rwHTML=r=>r.g?`<i class="gem"></i>${r.g}`:`<i class="coin"></i>&nbsp;${r.c}`;

let srvSkew=0;
const clockOk=()=>Date.now()>=(S.clk||0)-2*3600e3&&Math.abs(srvSkew)<3*3600e3;

  $('days').innerHTML=DAILY.map((r,k)=>`<div class="day ${k+1<cur||(!ready&&k+1===cur)?'done':''} ${ready&&k+1===cur?'now':''}">${t('day',k+1)}<b>${rwHTML(r)}</b></div>`).join('');
  $('claimDay').disabled=!ready;$('claimDay').textContent=ready?t('claim'):clockOk()?t('tomorrow'):t('fixClock');
  const Lst=$('misList');Lst.innerHTML='';

    d.innerHTML=`<div class="info"><div class="nm">${mtxt(m)}</div><div class="bar g"><i style="width:${Math.min(100,m.prog/m.n*100)}%"></i></div><div class="pr">${Math.min(m.prog,m.n)}/${m.n}</div></div>`;

    d.appendChild(b);Lst.appendChild(d)});

function trackMissions(final){
  ensureMissions();const done=[];
  S.missions.forEach(m=>{if(m.claimed)return;const was=m.prog>=m.n;
    if(m.t==='perf')m.prog=Math.max(m.prog,perfects);
    if(m.t==='floors')m.prog=Math.max(m.prog,score);
    if(m.t==='games')m.prog++;
    if(m.t==='coins')m.prog+=final;
    if(m.t==='power')m.prog+=run.powers;
    if(m.t==='combo')m.prog=Math.max(m.prog,maxCombo);

/* ================= ANTI-TRAPAÇA ================= */
// Cada partida guarda um resumo dos toques. No fim, se o padrão for de robô, macro ou jogo alterado,
// a partida vale normalmente pra você (moedas, recorde), mas NÃO entra no ranking mundial.
function runVerdict(sc){
  const r=run||{},why=[];
  if(S.tamper)why.push('save');
  const taps=r.taps||[],errs=(r.errs||[]).filter(e=>!e.mag);
  if(taps.some(tp=>!tp.tr))why.push('synthetic');               // toque falso gerado por script
  if(sc>=30&&r.play<sc*120)why.push('fast');                    // andares demais pro tempo jogado
  if(stack.length-1!==sc)why.push('state');                      // placar não bate com a torre
  if(taps.length>=25){
    const cnt={};let mx=0;taps.forEach(tp=>{const k=tp.x+','+tp.y;cnt[k]=(cnt[k]||0)+1;if(cnt[k]>mx)mx=cnt[k]});
    const iv=[];for(let k=1;k<taps.length;k++)iv.push(taps[k].t-taps[k-1].t);
    const mean=iv.reduce((a,b)=>a+b,0)/iv.length,sd=Math.sqrt(iv.reduce((a,b)=>a+(b-mean)**2,0)/iv.length);
    // sempre no mesmo pixel = autoclick. Com mouse (Chromebook/emulador) o cursor parado é normal,
    // então aí só conta se o ritmo também for regular demais
    const mouse=taps.filter(tp=>tp.pt==='mouse').length>taps.length/2;
    if(mx/taps.length>.8&&(!mouse||(mean>0&&sd/mean<.15)))why.push('samepx');
    if(mean>0&&sd/mean<.03)why.push('rhythm');                   // ritmo perfeito de máquina
  }
  if(errs.length>=120&&errs.filter(e=>e.e>=e.tol).length<=1)why.push('perfect'); // 120 perfeitos quase sem erro
  return why;
}

function trackMonth(sc){const k=monthKey();if(S.lb.mb.k!==k)S.lb.mb={k,s:0};if(sc>S.lb.mb.s)S.lb.mb.s=sc;save()}

async function submitSafe(on,board,v){try{await on.submit(board,v,S.lb.name,S.lb.cc);return v}
  catch(e){if(!/permission|PERMISSION/.test(String(e&&(e.code||e.message))))throw e;const m=await on.mine(board);if(m&&m.s>v){await on.submit(board,m.s,S.lb.name,S.lb.cc);return m.s}throw e}}
function syncScores(force){
  const on=OL();if(!on)return Promise.resolve(false);if(lbBusy)return lbBusy;force=force||S.lb.dirty;const nameAt=S.lb.name+'|'+S.lb.cc;
  lbBusy=(async()=>{let ok=true;
    try{if(S.lb.rb>S.lb.all||(force&&S.lb.all>0)){const v=Math.max(S.lb.rb,S.lb.all);S.lb.all=await submitSafe(on,'all',v);save()}}catch(e){ok=false}
    try{const k=monthKey();if(S.lb.mk!==k){S.lb.mk=k;S.lb.ms=0}
      if(S.lb.mb.k===k&&(S.lb.mb.s>S.lb.ms||(force&&S.lb.ms>0))){const v=Math.max(S.lb.mb.s,S.lb.ms);S.lb.ms=await submitSafe(on,k,v);save()}}catch(e){ok=false}
    // desafio diário que não chegou a ser enviado (sem internet, erro...)
    try{if(typeof dayKey==='function'&&S.dly&&S.dly.k===dayKey()&&S.dly.best>S.dly.sent){await on.submit(dayKey(),S.dly.best,S.lb.name,S.lb.cc);S.dly.sent=S.dly.best;save()}}catch(e){}
    // só limpa o "precisa reenviar" se o nome/país não mudou no meio do envio
    if(ok&&force&&S.lb.dirty&&nameAt===S.lb.name+'|'+S.lb.cc){S.lb.dirty=false;save()}
    return ok})().finally(()=>{lbBusy=null});
  return lbBusy;
}

    ctx.strokeStyle=ph>0?`rgba(120,230,255,${a})`:`rgba(190,150,255,${a*.7})`;ctx.lineWidth=2+3*(1-r);
    ctx.beginPath();ctx.ellipse(W/2,cy,20+r*W*.75,6+r*46,0,0,Math.PI*2);ctx.stroke()}
  if(moving&&ph>.25){const n=4,dir=moving.dir;ctx.strokeStyle=`rgba(160,240,255,${(ph-.25)*.8})`;ctx.lineWidth=2;
    for(let k=0;k<n;k++){const yy=y+6+k*(BH-12)/(n-1),x0=dir>0?moving.x:moving.x+moving.w,len=18+ph*amp*120;ctx.beginPath();ctx.moveTo(x0-dir*4,yy);ctx.lineTo(x0-dir*(4+len),yy);ctx.stroke()}}
  ctx.restore();
}

/* ================= MODOS DE JOGO (v1.6) =================
   Clássico (vale ranking), Desafio diário (já existia), Contra o tempo (60 s), Desafio da semana (regra especial
   que muda toda segunda), Torre estreita (nível 10) e Zen (não perde, sem prêmios).
   Só o Clássico e o Diário vão pro ranking online; os outros guardam o recorde no celular. */
S.mb=Object.assign({time:0,narrow:0,zen:0,wk:{n:-1,best:0}},S.mb||{});
S.selMode=S.selMode||'normal';
const WEEK_RULES=['wind','crazy','narrow','fast','magnet'];
// semana começando na segunda (hora do servidor)
const weekNo=()=>Math.floor((nowSrv()/864e5+3)/7);
const weekRule=()=>WEEK_RULES[((weekNo()%WEEK_RULES.length)+WEEK_RULES.length)%WEEK_RULES.length];
const weekLeftD=()=>Math.max(1,Math.ceil((((weekNo()+1)*7-3)*864e5-nowSrv())/864e5));
const wkBest=()=>S.mb.wk.n===weekNo()?S.mb.wk.best:0;
// regras de cada modo
const MR={
  normal:{ranked:1,powers:1,revive:1,rw:1},
  daily:{ranked:1,rw:1},
  time:{powers:1,rw:1,keep:'penalty',timer:60000},
  weekly:{powers:1,rw:1},
  narrow:{powers:1,revive:1,rw:1.25,base:.34},
  zen:{keep:'free',calm:1,rw:0}
};
const MODES=[
  {k:'normal',ic:'🏗️',c:['#ffd46b','#ff9a3d']},
  {k:'daily',ic:'📅',c:['#6fd0ff','#2a86d8']},
  {k:'time',ic:'⏱️',c:['#ff7a9c','#e0305a']},
  {k:'weekly',ic:'🎯',c:['#c7b3ff','#7a5ae0']},
  {k:'narrow',ic:'📏',c:['#6ff0a8','#1fa864'],lvl:10},
  {k:'zen',ic:'🌙',c:['#a8e6ff','#5aa8ec']}
];
const MRc=()=>MR[mode]||MR.normal;
const modeLocked=m=>m.lvl&&S.lvl<m.lvl;
const wkRuleOn=r=>mode==='weekly'&&weekRule()===r;
// largura inicial da torre no modo atual
const baseW=()=>(MRc().base||(wkRuleOn('narrow')?.34:BASEW));

/* ================= JOGABILIDADE (v1.6): chefão, blocos especiais, câmera lenta, vibração com ritmo ================= */
/* ---- CHEFÃO a cada 50 andares: 10 blocos com uma regra maluca; passou = baú grande + figurinha ---- */
const BOSS_TYPES=['ghost','flip','fast','shrink'];
const bossOk=()=>mode!=='zen'&&mode!=='time';
function bossStart(){const k=BOSS_TYPES[((score/50|0)-1)%BOSS_TYPES.length];run.boss={k,left:10};sfx.fall();setTimeout(()=>sfx.power(),120);vib('boss');shake=Math.max(shake,6);
  setTimeout(()=>{banner(t('bossT'),t('boss_'+k));sfx.whoosh()},200);tip('boss',t('tipBoss'),'mid')}
function bossStep(){const b=run.boss;if(!b)return;b.left--;if(b.left>0)return;run.boss=null;run.bossWins=(run.bossWins||0)+1;
  const cg=60+Math.floor(score/2);run.chest+=cg;run.chests++;const y=yOf(stack.length-1);addFloat(W/2,y-60,t('bossWin'),'#ffc23d',24);addFloat(W/2,y-30,'+'+cg,'#ffc23d',20);burst(W/2,y,0,50,'#ffc23d');sfx.fanfare();vib('bossWin');
  const st=dropSticker();(run.stk=run.stk||[]).push(st.ic);setTimeout(()=>addFloat(W/2,yOf(stack.length-1)-80,t('stkGot',st.ic),'#4fe39a',20),500)}
// o que o chefão faz com o bloco que está andando
function bossMove(m,dt){const b=run&&run.boss;if(!b||state!=='play')return 1;
  if(b.k==='fast')return 1.35;
  if(b.k==='flip'){if(m.fx==null)m.fx=W*(.25+Math.random()*.5);const c=m.x+m.w/2;if(!m.flipped&&((m.dir>0&&c>m.fx)||(m.dir<0&&c<m.fx))){m.flipped=true;if(Math.random()<.6)m.dir*=-1}}
  if(b.k==='shrink'){if(m.bw==null)m.bw=m.w;m.w=m.bw*(.86+.14*Math.abs(Math.sin(tNow*.004)))}

let wasPlaying=false,qN=0,qSlow=0,qBad=0,qGood=0,qUpDone=false,rawLast=0,vsync=16.7;
// qualidade automática: olha os frames atrasados durante a partida (não a média, que esconde os engasgos).
// Se mais de 12% dos frames atrasarem em 2 janelas seguidas (ou 30% numa só), baixa a resolução um degrau (2 → 1.75 → 1.5 → 1.25 → 1) e lembra.
// Se depois ficar tudo liso por um bom tempo, tenta subir um degrau de volta (1 vez por sessão).
function qualityWatch(ms){if(state!=='play'||document.hidden||!run||run.play<2500||ms>250)return;
  const target=vsync<10.5?vsync*2:vsync;if(ms>target*1.45)qSlow++;if(++qN<90)return;const f=qSlow/qN;qN=0;qSlow=0;
  if(f>.12){qGood=0;if((++qBad>=2||f>.3)&&QCAP>1&&(devicePixelRatio||1)>1){qBad=0;setQ(Math.min(QCAP,devicePixelRatio||1)-.25)}return}
  qBad=0;if(f<.015&&++qGood>=10&&!qUpDone&&QCAP+.25<=qCeil()){qUpDone=true;qGood=0;setQ(QCAP+.25)}}
// celular que roda liso sobe a nitidez aos poucos (1 degrau por sessão) até a resolução real da tela (máx. 3);
// onde já engasgou, não tenta de novo por 3 dias
const QMAX=Math.min(3,Math.max(1,devicePixelRatio||1));

function setQ(v){const down=v<QCAP;if(down)try{localStorage.setItem('bs_qfail',JSON.stringify({q:QCAP,t:Date.now()}))}catch(e){}
  QCAP=Math.max(1,Math.min(QMAX,+v.toFixed(2)));try{localStorage.setItem('bs_q',String(QCAP))}catch(e){}resize()}
// telas paradas (loja, fim de partida, pausa...): o fundo anda a ~30 fps, sobra bateria e o celular esquenta menos

  frame.lt=tNow;
  if(state==='play'&&moving){

    if(P.calm<=0&&!hazOff()){/*vento das nuvens 40% mais fraco*/if(wd===1||wkRuleOn('wind'))sp*=1+.33*Math.sin(tNow*.0028);if(wd===2||wkRuleOn('crazy'))sp*=moving.v;if(wd>=3)sp*=1+waveAmp(wd)*Math.sin(tNow*WAVE_W)}

  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.vy+=.15*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=.025*dt;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.col;const s=6*p.l+2;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);if(p.l<=0)parts.splice(k,1)}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  for(let k=floats.length-1;k>=0;k--){const f=floats[k];f.y-=1.1*dt;f.l-=.018*dt;ctx.globalAlpha=Math.max(0,f.l);const sc=f.l>.85?1+(f.l-.85)*2:1;const sp=f.sp&&f.sp.d===DPR?f.sp:(f.sp=txtSprite(f.txt,f.col,f.size),f.sp.d=DPR,f.sp);ctx.drawImage(sp.cv,f.x-sp.ax*sc,f.y-sp.ay*sc,sp.w*sc,sp.h*sc);if(f.l<=0)floats.splice(k,1)}
  ctx.globalAlpha=1;ctx.restore();
  slowDraw();
  if(flash>0&&RM())flash=0;
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.1})`;ctx.fillRect(0,0,W,H);flash-=.08*dt}
  if(!$('shop').hidden||!$('coll').hidden)drawPreviews();
}

let lastTap=0;
const tap=e=>{if(state!=='play')return;e.preventDefault();if(e.isPrimary===false)return;const n=performance.now();if(n-lastTap<110)return;lastTap=n;
  if(run&&run.taps&&run.taps.length<3000)run.taps.push({t:n,x:Math.round(e.clientX),y:Math.round(e.clientY),tr:e.isTrusted!==false,pt:e.pointerType||''});drop()};
cv.addEventListener('pointerdown',tap);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='play')drop();else if(state==='menu')startGame()}if(e.code==='Escape'){state==='play'?pauseGame():state==='pause'&&resumeGame()}});
$('play').onclick=()=>startMode(S.selMode);$('again').onclick=()=>{if(mode==='daily'){if(dailyInfo().tries<DAILY_TRIES)startDaily();else{mode='normal';startGame()}}else startMode(mode)};

/* ================= INTRO ================= */
function runIntro(done){
  const el=$('intro'),img=$('studioImg');
  img.onload=()=>{img.hidden=false;$('studioWord').hidden=true};img.onerror=()=>{img.hidden=true};
  if(img.complete&&img.naturalWidth){img.hidden=false;$('studioWord').hidden=true}
  let ended=false;const end=()=>{if(ended)return;ended=true;el.classList.add('out');setTimeout(()=>{el.remove()},550);done()};
  el.addEventListener('pointerdown',end);setTimeout(end,2300);
}

addEventListener('resize',resize);resize();
SKINS.forEach(sk=>{if(sk.cur==='lvl'&&sk.price<=S.lvl&&!S.owned.includes(sk.id))S.owned.push(sk.id)});save();
applyLang();wallet();ensureMissions();showMenu();
requestAnimationFrame(frame);
// aquece o desenho da skin durante a abertura (a 1ª partida não engasga)
setTimeout(()=>{const t0=tNow;try{bcSync();const wc=document.createElement('canvas');wc.width=400;wc.height=BH*2;const c=wc.getContext('2d');for(let k=0;k<40;k++){tNow+=16;block(0,0,300,k,1,c)}}catch(e){}tNow=t0},300);
runIntro(()=>{buildLogo();warmScenery();if(dailyReady())goTab('season')});
if(N){
  N.initAds();
  N.initBilling(PRODUCT_IDS,(id,tok)=>{if(grantPack(id,tok))toast(t('buyDelivered'))}).then(prices=>{PACKS.forEach(p=>{if(prices[p.id])p.price=prices[p.id]});if(!$('shop').hidden)renderShop()});
  N.onPause&&N.onPause(()=>{if(state==='play')pauseGame();if(state==='revive'&&!$('revive').hidden)clearInterval(revTimer);A.ctx&&A.ctx.suspend();flushMirror();cloudAuto()});
  N.onBack(()=>{
    if(!$('upd').hidden){$('updNo').click();return}
    if(!$('clAsk').hidden){$('clNo').click();return}
    if(!$('rkWin').hidden){$('rkWinOk').click();return}
    if(!$('ovt').hidden){$('ovtNo').click();return}
    if(!$('modes').hidden){$('modes').hidden=true;return}
    if(!$('pp').hidden){showMenu();return}
    if(!$('coll').hidden){showMenu();return}
    if(state==='revive'&&!$('revive').hidden){$('revSkip').click();return}
    if(!$('rkWin').hidden){$('rkWinOk').click();return}
    if(!$('buy').hidden){$('buy').hidden=true;return}
    if(!$('prof').hidden){$('pfCancel').click();return}
    if(!$('rank').hidden){$('closeRank').click();return}
    if(!$('help').hidden){$('closeHelp').click();return}
    if(!$('settings').hidden){$('closeSet').click();return}
    if(!$('shop').hidden){$('closeShop').click();return}
    if(!$('mis').hidden){showMenu();return}
    if(!$('over').hidden){showMenu();return}
    if(state==='play'){pauseGame();return}
    if(state==='pause'){resumeGame();return}
    if(state==='menu'){N.exitApp();return}
  });
}
})();
